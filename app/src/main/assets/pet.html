<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clawd 桌宠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 80px; height: 80px;
    background: transparent;
    overflow: visible;
  }
  .stage {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  #pet-svg {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    cursor: pointer;
    display: block;
    overflow: visible;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ════════════════════════════════════════
     待机
  ════════════════════════════════════════ */
  .idle-eye {
    transform-box: fill-box;
    transform-origin: center center;
    animation: idle-blink 3.4s infinite;
  }
  @keyframes idle-blink {
    0%,42%,58%,100% { transform: scaleY(1); }
    50%             { transform: scaleY(0.05); }
  }

  .idle-body {
    transform-origin: 7.5px 13px;
    animation: idle-bob 2.8s infinite ease-in-out;
  }
  @keyframes idle-bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-.5px); }
  }

  /* ════════════════════════════════════════
     动作1：Wink
  ════════════════════════════════════════ */
  /* wink 期间暂停 idle-eye g 整体的 scaleY，避免左眼随之眨动 */
  #pet-svg.do-wink .idle-eye {
    animation-play-state: paused !important;
    transform: scaleY(1) !important;
  }
  #pet-svg.do-wink .w-eye-r {
    transform-box: fill-box;
    transform-origin: center center;
    animation: once-wink .7s ease-in-out forwards !important;
  }
  #pet-svg.do-wink .w-body {
    animation: once-tilt .7s ease-in-out forwards !important;
    transform-origin: 7.5px 12px;
  }
  #pet-svg.do-wink .w-star {
    animation: once-star .8s ease-out forwards !important;
  }
  @keyframes once-wink {
    0%       { transform: scaleY(1); }
    20%,65%  { transform: scaleY(0.05); }
    100%     { transform: scaleY(1); }
  }
  @keyframes once-tilt {
    0%,100%  { transform: rotate(0) translateY(0); }
    25%,70%  { transform: rotate(6deg) translateY(.3px); }
  }
  @keyframes once-star {
    0%   { opacity:0; transform:translate(0,0) scale(.3); }
    25%  { opacity:1; transform:translate(var(--tx),var(--ty)) scale(1.2); }
    70%  { opacity:.85; transform:translate(var(--tx),var(--ty)) scale(1); }
    100% { opacity:0; transform:translate(var(--tx),calc(var(--ty) - 4px)) scale(.4); }
  }

  /* ════════════════════════════════════════
     动作2：开心蹦跳
  ════════════════════════════════════════ */
  #pet-svg.do-happy .h-crab {
    animation: crab-jump .6s cubic-bezier(.25,1.6,.4,1) forwards !important;
    transform-origin: 7.5px 16px;
  }
  @keyframes crab-jump {
    0%   { transform: translateY(0) scaleX(1) scaleY(1); }
    30%  { transform: translateY(-9px) scaleX(.92) scaleY(1.06); }
    60%  { transform: translateY(-9px) scaleX(.92) scaleY(1.06); }
    80%  { transform: translateY(1px) scaleX(1.05) scaleY(.96); }
    100% { transform: translateY(0) scaleX(1) scaleY(1); }
  }

  /* ════════════════════════════════════════
     动作3：举小爱心
  ════════════════════════════════════════ */
  #pet-svg.do-love .l-arm-left {
    transform-box: fill-box;
    transform-origin: right bottom;
    animation: arm-left .45s ease-in-out forwards !important;
  }
  #pet-svg.do-love .l-arm-right {
    transform-box: fill-box;
    transform-origin: left bottom;
    animation: arm-right .45s ease-in-out forwards !important;
  }
  @keyframes arm-left {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(60deg); }
    70%  { transform: rotate(60deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes arm-right {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(-60deg); }
    70%  { transform: rotate(-60deg); }
    100% { transform: rotate(0deg); }
  }
  .l-heart { opacity:0; transform-box:fill-box; transform-origin:center bottom; }
  #pet-svg.do-love .l-heart {
    animation: heart-grow 1s ease-out forwards !important;
  }
  @keyframes heart-grow {
    0%   { opacity:0;  transform: scale(.1) translateY(0); }
    25%  { opacity:1;  transform: scale(.7) translateY(-2px); }
    55%  { opacity:1;  transform: scale(1.2) translateY(-3px); }
    72%  { opacity:1;  transform: scale(1.5) translateY(-3px); }
    80%  { opacity:.9; transform: scale(1.6) translateY(-3px); }
    100% { opacity:0;  transform: scale(1.7) translateY(-4px); }
  }
  .l-spark { opacity:0; transform-box:fill-box; transform-origin:center center; }
  #pet-svg.do-love .l-spark {
    animation: spark-out .45s ease-out var(--sd,0s) forwards !important;
  }
  @keyframes spark-out {
    0%   { opacity:1; transform: translate(0,0) scale(1); }
    100% { opacity:0; transform: translate(var(--sx),var(--sy)) scale(.2); }
  }

  /* ════════════════════════════════════════
     动作4：吹泡泡
  ════════════════════════════════════════ */
  #pet-svg.do-bubble .b-eye {
    transform-box: fill-box;
    transform-origin: center center;
    animation: blow-eye 2.2s ease-in-out forwards !important;
  }
  @keyframes blow-eye {
    0%,18%   { transform: scaleY(1); }
    25%,68%  { transform: scaleY(0.05); }
    80%,100% { transform: scaleY(1); }
  }
  #b-mouth { r: 0px; }
  #pet-svg.do-bubble #b-mouth {
    animation: mouth-blow 2.2s ease-in-out forwards !important;
  }
  @keyframes mouth-blow {
    0%,18%   { r: 0px; }
    24%      { r: 1.1px; }
    42%      { r: 1.1px; }
    68%      { r: 0.15px; }
    75%,100% { r: 0px; }
  }
  .b-wand { opacity:0; }
  #pet-svg.do-bubble .b-wand {
    animation: wand-show 2.2s forwards !important;
  }
  @keyframes wand-show {
    0%,18%  { opacity:0; }
    22%,70% { opacity:1; }
    78%,100%{ opacity:0; }
  }
  .b-bubble { opacity:0; }
  #pet-svg.do-bubble .b-bubble {
    animation: bubble-float var(--bd,1.1s) ease-out var(--bdelay,0s) forwards !important;
  }
  @keyframes bubble-float {
    0%   { opacity:0;   transform: translate(0,0) scale(.2); }
    15%  { opacity:.8;  transform: translate(var(--bx1),var(--by1)) scale(1); }
    55%  { opacity:.65; transform: translate(var(--bx2),var(--by2)) scale(1.05); }
    100% { opacity:0;   transform: translate(var(--bx3),var(--by3)) scale(.7); }
  }

   /* 动作5：摸摸头已移除 */

   /* ════════════════════════════════════════
      动作6：说话气泡
  ════════════════════════════════════════ */
  #pet-svg.do-talk .t-body {
    transform-origin: 7.5px 12px;
    animation: talk-sway 2.3s ease-in-out forwards !important;
  }
  @keyframes talk-sway {
    0%,100% { transform: rotate(0deg); }
    15%     { transform: rotate(-2deg); }
    30%     { transform: rotate(2deg); }
    45%     { transform: rotate(-1.5deg); }
    60%     { transform: rotate(1.5deg); }
    75%     { transform: rotate(-.5deg); }
    88%     { transform: rotate(0deg); }
  }
  #talk-bubble {
    position: absolute;
    bottom: 33px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    transform-origin: center bottom;
    background: #fff;
    color: #222;
    font-size: 9px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
    padding: 4px 8px;
    border-radius: 6px;
    white-space: nowrap;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  #talk-bubble::after {
    content: '';
    position: absolute;
    bottom: -4px; left: 50%;
    transform: translateX(-50%);
    border: 4px solid transparent;
    border-top: 4px solid #fff;
    border-bottom: 0;
  }
  #talk-bubble.show {
    animation: bubble-in .25s cubic-bezier(.2,1.4,.4,1) forwards,
               bubble-out .3s ease-in 2s forwards;
  }
  @keyframes bubble-in {
    0%   { opacity:0; transform:translateX(-50%) scale(.3); }
    100% { opacity:1; transform:translateX(-50%) scale(1); }
  }
  @keyframes bubble-out {
    0%   { opacity:1; transform:translateX(-50%) scale(1); }
    100% { opacity:0; transform:translateX(-50%) translateY(-8px) scale(.85); }
  }

  /* ════════════════════════════════════════
     动作7：害羞
  ════════════════════════════════════════ */
  #pet-svg.do-shy .s-body {
    transform-box: fill-box;
    transform-origin: 7.5px 11px;
    animation: shy-squish 2.0s ease-in-out forwards !important;
  }
  @keyframes shy-squish {
    0%   { transform: translateY(0) scale(1); }
    18%  { transform: translateY(1.5px) scale(0.92); }
    72%  { transform: translateY(1.5px) scale(0.92); }
    100% { transform: translateY(0) scale(1); }
  }
  #pet-svg.do-shy .s-eye-rect {
    animation: s-eye-hide 2.0s forwards !important;
  }
  @keyframes s-eye-hide {
    0%   { opacity:1; }
    10%  { opacity:0; }
    85%  { opacity:0; }
    100% { opacity:1; }
  }
  .s-eye-curve { opacity:0; }
  #pet-svg.do-shy .s-eye-curve {
    animation: s-eye-show 2.0s forwards !important;
  }
  @keyframes s-eye-show {
    0%   { opacity:0; }
    10%  { opacity:1; }
    85%  { opacity:1; }
    100% { opacity:0; }
  }
  .s-blush { opacity:0; }
  #pet-svg.do-shy .s-blush {
    animation: blush-pop 2.0s ease-out forwards !important;
  }
  @keyframes blush-pop {
    0%   { opacity:0; }
    15%  { opacity:0.9; }
    72%  { opacity:0.9; }
    100% { opacity:0; }
  }
  #pet-svg.do-shy .s-arm-l {
    transform-box: fill-box;
    transform-origin: right bottom;
    animation: arm-l-shy 2.0s ease-in-out forwards !important;
  }
  #pet-svg.do-shy .s-arm-r {
    transform-box: fill-box;
    transform-origin: left bottom;
    animation: arm-r-shy 2.0s ease-in-out forwards !important;
  }
  @keyframes arm-l-shy {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(70deg); }
    72%  { transform: rotate(70deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes arm-r-shy {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-70deg); }
    72%  { transform: rotate(-70deg); }
    100% { transform: rotate(0deg); }
  }

  /* ════════════════════════════════════════
     动作8：挠头
   ════════════════════════════════════════ */
  #pet-svg.do-scratch .sc-body {
    transform-origin: 7.5px 13px;
    animation: scratch-tilt 2.0s ease-in-out forwards !important;
  }
  @keyframes scratch-tilt {
    0%   { transform: rotate(0deg); }
    12%  { transform: rotate(-5deg); }
    85%  { transform: rotate(-5deg); }
    100% { transform: rotate(0deg); }
  }
  .sc-arm-r {
    transform-box: fill-box;
    transform-origin: left top;
  }
  #pet-svg.do-scratch .sc-arm-r {
    animation: scratch-arm 2.0s ease-in-out forwards !important;
  }
  @keyframes scratch-arm {
    0%   { transform: rotate(0deg) translate(0,0); }
    10%  { transform: rotate(-90deg) translate(-1px,-1px); }
    18%  { transform: rotate(-95deg) translate(-1.5px,-1px); }
    26%  { transform: rotate(-82deg) translate(-0.5px,-1.5px); }
    34%  { transform: rotate(-96deg) translate(-1.5px,-1px); }
    42%  { transform: rotate(-80deg) translate(-0.5px,-1.5px); }
    50%  { transform: rotate(-95deg) translate(-1.5px,-1px); }
    58%  { transform: rotate(-83deg) translate(-0.5px,-1.5px); }
    66%  { transform: rotate(-94deg) translate(-1.5px,-1px); }
    74%  { transform: rotate(-84deg) translate(-0.5px,-1.5px); }
    82%  { transform: rotate(-90deg) translate(-1px,-1px); }
    100% { transform: rotate(0deg) translate(0,0); }
  }
  #pet-svg.do-scratch .sc-eye-rect {
    animation: sc-eye-hide 2.0s forwards !important;
  }
  @keyframes sc-eye-hide {
    0%  { opacity:1; }
    10% { opacity:0; }
    85% { opacity:0; }
    100%{ opacity:1; }
  }
  .sc-eye-dot { opacity:0; }
  #pet-svg.do-scratch .sc-eye-dot {
    animation: sc-dot-show 2.0s forwards !important;
  }
  @keyframes sc-dot-show {
    0%  { opacity:0; }
    10% { opacity:1; }
    85% { opacity:1; }
    100%{ opacity:0; }
  }
  .sc-question {
    opacity: 0;
    transform-origin: center bottom;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 4px;
    font-weight: bold;
    fill: #555;
  }
  #pet-svg.do-scratch .sc-question {
    animation: question-pop 2.0s ease-out forwards !important;
  }
  @keyframes question-pop {
    0%   { opacity:0; transform: translate(0,0) scale(0.2); }
    14%  { opacity:1; transform: translate(0,-2px) scale(1.2); }
    20%  { opacity:1; transform: translate(0,-3px) scale(1); }
    72%  { opacity:1; transform: translate(0,-3px) scale(1); }
    85%  { opacity:0.6; transform: translate(0,-6px) scale(0.9); }
    100% { opacity:0; transform: translate(0,-9px) scale(0.7); }
  }
  .sc-q-bg { opacity:0; transform-origin: center center; }
  #pet-svg.do-scratch .sc-q-bg {
    animation: q-bg-pop 2.0s ease-out forwards !important;
  }
  @keyframes q-bg-pop {
    0%   { opacity:0; transform: translate(0,0) scale(0.2); }
    14%  { opacity:0.85; transform: translate(0,-2px) scale(1.2); }
    20%  { opacity:0.85; transform: translate(0,-3px) scale(1); }
    72%  { opacity:0.85; transform: translate(0,-3px) scale(1); }
    85%  { opacity:0.4; transform: translate(0,-6px) scale(0.9); }
    100% { opacity:0; transform: translate(0,-9px) scale(0.7); }
  }

  /* ════════════════════════════════════════
     双击动作A：打招呼
   ════════════════════════════════════════ */
  #pet-svg.do-wave .wv-body {
    transform-origin: 7.5px 15px;
    animation: wave-jump 1.4s cubic-bezier(.25,1.4,.4,1) forwards !important;
  }
  @keyframes wave-jump {
    0%      { transform: translateY(0) scaleX(1) scaleY(1); }
    16%,68% { transform: translateY(-4px) scaleX(.97) scaleY(1.03); }
    78%     { transform: translateY(0.5px) scaleX(1.02) scaleY(.98); }
    100%    { transform: translateY(0) scaleX(1) scaleY(1); }
  }
  .wv-arm-r {
    transform-box: fill-box;
    transform-origin: left top;
  }
  #pet-svg.do-wave .wv-arm-r {
    animation: wave-arm 1.4s ease-in-out forwards !important;
  }
  @keyframes wave-arm {
    0%   { transform: rotate(0deg); }
    12%  { transform: rotate(-70deg); }
    22%  { transform: rotate(-55deg); }
    32%  { transform: rotate(-75deg); }
    42%  { transform: rotate(-50deg); }
    52%  { transform: rotate(-72deg); }
    62%  { transform: rotate(-55deg); }
    72%  { transform: rotate(-70deg); }
    86%  { transform: rotate(-20deg); }
    100% { transform: rotate(0deg); }
  }

  /* ════════════════════════════════════════
     单击动作：浇花 do-water-flower
     图层（从下到上）：螃蟹 → 花盆 → 花朵 → 水壶(随右钳) → 水滴
   ════════════════════════════════════════ */

  /* 浇花专用右钳（默认隐藏，浇花时替换原 b-arm-group） */
  .wf-arm-r { opacity: 0; }
  #pet-svg.do-water-flower .wf-arm-r {
    opacity: 1;
    transform-box: fill-box; transform-origin: left top;
    animation: wf-arm 3s ease-in-out forwards !important;
  }
  @keyframes wf-arm {
    0%,10%   { transform: rotate(0deg); }
    22%,72%  { transform: rotate(-18deg); }
    90%,100% { transform: rotate(0deg); }
  }
  /* 浇花时隐藏原右钳（避免两条钳子重叠） */
  #pet-svg.do-water-flower #b-arm-group { opacity: 0; }

  /* 水壶：平时隐藏，浇花时出现（只改 opacity，不写 transform，避免覆盖 x/y 坐标） */
  .wf-can { opacity: 0; }
  #pet-svg.do-water-flower .wf-can {
    animation: wf-can-show 3s ease-out forwards !important;
  }
  @keyframes wf-can-show {
    0%,14%   { opacity:0; }
    24%      { opacity:1; }
    78%      { opacity:1; }
    90%,100% { opacity:0; }
  }

  /* 花盆：平时隐藏，浇花时出现（只改 opacity，不碰 transform） */
  .wf-pot { opacity: 0; }
  #pet-svg.do-water-flower .wf-pot {
    animation: wf-pot-show 3s ease-out forwards !important;
  }
  @keyframes wf-pot-show {
    0%,6%    { opacity:0; }
    16%      { opacity:1; }
    80%      { opacity:1; }
    92%,100% { opacity:0; }
  }

  /* 小苗生长（transform-box: view-box 保证缩放基准正确） */
  .wf-sprout { opacity: 0; }
  #pet-svg.do-water-flower .wf-sprout {
    transform-box: view-box;
    transform-origin: 12.05px 13.4px;
    animation: wf-grow 3s ease-in-out forwards !important;
  }
  @keyframes wf-grow {
    0%,22%  { opacity:0; transform: scaleY(0); }
    32%     { opacity:1; transform: scaleY(.3); }
    50%     { opacity:1; transform: scaleY(.7); }
    62%     { opacity:1; transform: scaleY(1); }
    80%     { opacity:1; transform: scaleY(1); }
    92%,100%{ opacity:0; transform: scaleY(1); }
  }

  /* 花朵绽放 */
  .wf-bloom { opacity: 0; transform-box: view-box; transform-origin: 12.05px 10.8px; }
  #pet-svg.do-water-flower .wf-bloom {
    animation: wf-bloom 3s ease-out forwards !important;
  }
  @keyframes wf-bloom {
    0%,48%  { opacity:0; transform: scale(0); }
    58%     { opacity:1; transform: scale(1.2); }
    64%,80% { opacity:1; transform: scale(1); }
    92%,100%{ opacity:0; transform: scale(.6); }
  }

  /* 水滴下落 */
  .wf-drop { opacity: 0; }
  #pet-svg.do-water-flower .wf-drop {
    animation: wf-drop 3s var(--wfd, 0s) forwards linear !important;
  }
  @keyframes wf-drop {
    0%,24%  { opacity:0; transform: translateY(0); }
    28%     { opacity:0; transform: translateY(0); }
    34%     { opacity:.9; transform: translateY(1px); }
    50%     { opacity:.7; transform: translateY(4px); }
    62%     { opacity:.35; transform: translateY(6px); }
    66%,100%{ opacity:0; transform: translateY(8px); }
  }

  /* 浇花时的弯弯笑眼 */
  .wf-happy-eye { opacity: 0; }
  #pet-svg.do-water-flower .wf-happy-eye {
    animation: wf-eye-show 3s forwards !important;
  }
  @keyframes wf-eye-show {
    0%,18%  { opacity:0; }
    24%     { opacity:1; }
    78%     { opacity:1; }
    88%,100%{ opacity:0; }
  }
  #pet-svg.do-water-flower .idle-eye {
    animation: wf-eye-hide 3s forwards !important;
  }
  @keyframes wf-eye-hide {
    0%,18%  { opacity:1; }
    24%     { opacity:0; }
    78%     { opacity:0; }
    88%,100%{ opacity:1; }
  }

  /* ════════════════════════════════════════
     单击动作：听音乐 do-listen-music
     耳机 + 音符飘浮 + 身体摇摆 + 哼唱嘴
   ════════════════════════════════════════ */
  /* 道具默认隐藏 */
  .lm-headphone, .lm-note, .lm-happy-eye, .lm-mouth { opacity: 0; }

  /* 激活时：身体左右摇摆（跟节拍晃） */
  #pet-svg.do-listen-music .lm-body {
    transform-origin: 7.5px 13px;
    animation: lm-sway 1.1s ease-in-out infinite !important;
  }
  @keyframes lm-sway {
    0%,100% { transform: rotate(-3deg); }
    50%     { transform: rotate(3deg); }
  }

  /* 激活时：暂停眨眼，换享受弯弯眼 */
  #pet-svg.do-listen-music .idle-eye {
    animation: lm-eye-hide .4s forwards !important;
  }
  @keyframes lm-eye-hide {
    0%   { opacity:1; }
    100% { opacity:0; }
  }
  #pet-svg.do-listen-music .lm-happy-eye {
    animation: lm-eye-show .4s forwards !important;
  }
  @keyframes lm-eye-show {
    0%   { opacity:0; }
    100% { opacity:1; }
  }

  /* 激活时：耳机出现（从上方落下） */
  #pet-svg.do-listen-music .lm-headphone {
    animation: lm-hp-show .5s ease-out forwards !important;
  }
  @keyframes lm-hp-show {
    0%   { opacity:0; transform: translateY(-2px); }
    100% { opacity:1; transform: translateY(0); }
  }

  /* 激活时：嘴巴哼唱 */
  #pet-svg.do-listen-music .lm-mouth {
    transform-box: fill-box; transform-origin: center center;
    animation: lm-hum .6s .3s ease-in-out infinite alternate !important;
  }
  @keyframes lm-hum {
    0%   { opacity:1; transform: scaleY(.7); }
    100% { opacity:1; transform: scaleY(1.2); }
  }

  /* 音符飘起 */
  .lm-note { font-family: serif; font-size: 3px; }
  #pet-svg.do-listen-music .lm-note {
    animation: lm-float var(--nd, 2s) var(--ndelay, 0s) infinite ease-out !important;
  }
  @keyframes lm-float {
    0%   { opacity: 0; transform: translate(0, 0) scale(.6); }
    12%  { opacity: .85; transform: translate(var(--nx, 0px), -1px) scale(1); }
    55%  { opacity: .7; transform: translate(var(--nx2, 1px), -5px) scale(.9); }
    100% { opacity: 0; transform: translate(var(--nx3, 0px), -10px) scale(.5); }
  }

  /* ════════════════════════════════════════
     双击动作B：比耶
   ════════════════════════════════════════ */
  #pet-svg.do-peace .pc-body {
    transform-origin: 7.5px 13px;
    animation: peace-pose 1.8s ease-in-out forwards !important;
  }
  @keyframes peace-pose {
    0%   { transform: rotate(0deg) translateY(0); }
    15%  { transform: rotate(-3deg) translateY(-1px); }
    70%  { transform: rotate(-3deg) translateY(-1px); }
    100% { transform: rotate(0deg) translateY(0); }
  }
  .pc-arm-l {
    transform-box: fill-box;
    transform-origin: right bottom;
  }
  #pet-svg.do-peace .pc-arm-l {
    animation: peace-arm-l 1.8s ease-in-out forwards !important;
  }
  @keyframes peace-arm-l {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(55deg); }
    70%  { transform: rotate(55deg); }
    100% { transform: rotate(0deg); }
  }
  #pet-svg.do-peace .pc-arm-r-base {
    animation: peace-arm-r-hide 1.8s forwards !important;
  }
  @keyframes peace-arm-r-hide {
    0%,12% { opacity:1; }
    20%    { opacity:0; }
    72%    { opacity:0; }
    100%   { opacity:1; }
  }
  .pc-v { opacity:0; }
  #pet-svg.do-peace .pc-v {
    animation: peace-v-fade 1.8s ease-in-out forwards !important;
  }
  @keyframes peace-v-fade {
    0%,12% { opacity:0; }
    20%    { opacity:1; }
    70%    { opacity:1; }
    85%    { opacity:0; }
    100%   { opacity:0; }
  }
  #pet-svg.do-peace .pc-eye-rect {
    animation: pc-eye-hide 1.8s forwards !important;
  }
  @keyframes pc-eye-hide {
    0%,12% { opacity:1; }
    20%    { opacity:0; }
    72%    { opacity:0; }
    100%   { opacity:1; }
  }
  .pc-eye-smile { opacity:0; }
  #pet-svg.do-peace .pc-eye-smile {
    animation: pc-eye-smile-show 1.8s forwards !important;
  }
  @keyframes pc-eye-smile-show {
    0%,12% { opacity:0; }
    20%    { opacity:1; }
    72%    { opacity:1; }
    100%   { opacity:0; }
  }
  .pc-spark { opacity:0; }
  #pet-svg.do-peace .pc-spark {
    animation: pc-spark-pop 1.4s ease-out var(--ps-d,0s) forwards !important;
  }
  @keyframes pc-spark-pop {
    0%   { opacity:0; transform: translate(0,0) scale(.2); }
    20%  { opacity:1; transform: translate(var(--psx),var(--psy)) scale(1.2); }
    55%  { opacity:.8; transform: translate(var(--psx),var(--psy)) scale(1); }
    100% { opacity:0; transform: translate(var(--psx),calc(var(--psy) - 2px)) scale(.5); }
  }

  /* ════════════════════════════════════════
     长按动作：生气
   ════════════════════════════════════════ */
  #pet-svg.do-angry .a-body {
    animation: angry-red 1.8s ease-in-out forwards,
               angry-shake 0.5s ease-in-out 0.12s 3 forwards !important;
  }
  @keyframes angry-red {
    0%   { filter: none; }
    15%  { filter: hue-rotate(-20deg) saturate(1.8) brightness(1.1); }
    80%  { filter: hue-rotate(-20deg) saturate(1.8) brightness(1.1); }
    100% { filter: none; }
  }
  @keyframes angry-shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-2px); }
    40%  { transform: translateX(2px); }
    60%  { transform: translateX(-2px); }
    80%  { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }
  #pet-svg.do-angry .a-eye-rect {
    animation: a-eye-hide 1.8s forwards !important;
  }
  @keyframes a-eye-hide {
    0%   { opacity:1; }
    12%  { opacity:0; }
    82%  { opacity:0; }
    100% { opacity:1; }
  }
  .a-eye-angry { opacity:0; }
  #pet-svg.do-angry .a-eye-angry {
    animation: a-eye-show 1.8s forwards !important;
  }
  @keyframes a-eye-show {
    0%   { opacity:0; }
    12%  { opacity:1; }
    82%  { opacity:1; }
    100% { opacity:0; }
  }
  .a-steam { opacity:0; }
  #pet-svg.do-angry .a-steam {
    animation: steam-rise .7s ease-out var(--st-d,0s) infinite !important;
  }
  #pet-svg:not(.do-angry) .a-steam { animation:none !important; opacity:0; }
  @keyframes steam-rise {
    0%   { opacity:0;   transform: translateY(0) scaleX(1); }
    20%  { opacity:0.8; transform: translateY(-1px) scaleX(1.1); }
    60%  { opacity:0.6; transform: translateY(-3px) scaleX(1.3); }
    100% { opacity:0;   transform: translateY(-6px) scaleX(0.8); }
  }
  #pet-svg.do-angry .a-arm-l {
    transform-box: fill-box;
    transform-origin: right top;
    animation: arm-angry-l 1.8s ease-in-out forwards !important;
  }
  #pet-svg.do-angry .a-arm-r {
    transform-box: fill-box;
    transform-origin: left top;
    animation: arm-angry-r 1.8s ease-in-out forwards !important;
  }
  @keyframes arm-angry-l {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(-25deg); }
    80%  { transform: rotate(-25deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes arm-angry-r {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(25deg); }
    80%  { transform: rotate(25deg); }
    100% { transform: rotate(0deg); }
  }

  /* ════════════════════════════════════════
     电量感知装饰层
  ════════════════════════════════════════ */

  /* 充电闪电（黄色，持续浮动） */
  #batt-bolt {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #batt-bolt.show {
    opacity: 1;
    animation: bolt-float 2s ease-in-out infinite;
  }
  @keyframes bolt-float {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-1.2px); }
  }

  /* 低电量闪电（红色，快速闪烁） */
  #batt-bolt-low {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s;
  }
  #batt-bolt-low.show {
    opacity: 1;
    animation: bolt-blink 1.1s ease-in-out infinite;
  }
  @keyframes bolt-blink {
    0%,100% { opacity: 1; transform: translateY(0); }
    50%     { opacity: 0.35; transform: translateY(0); }
  }

  /* 低电量皱眉（持久状态 class） */
  #pet-svg.state-low-battery .lb-brow { opacity: 1 !important; }
  .lb-brow { opacity: 0; transition: opacity 0.4s; pointer-events: none; }

  /* ════════════════════════════════════════
     睡眠作息系统
  ════════════════════════════════════════ */
  
  /* 睡眠专属眼睛层（默认隐藏） */
  .eye-sleep { opacity: 0; }
  .eye-daze  { opacity: 0; }
  
  /* 打哈欠：眼皮慢慢下垂 */
  #pet-svg.phase-yawn .idle-eye {
    animation: yawn-droop 1.8s ease-in forwards !important;
  }
  @keyframes yawn-droop {
    0%   { transform: scaleY(1); }
    100% { transform: scaleY(0.05); }
  }
  
  /* 睡着：横线闭眼 + 身体起伏 */
  #pet-svg.phase-sleep .idle-eye  { animation: none !important; transform: scaleY(0.05); }
  #pet-svg.phase-sleep .eye-sleep { opacity: 1; }
  #pet-svg.phase-sleep .idle-body {
    animation: sleep-breathe 3s ease-in-out infinite !important;
  }
  @keyframes sleep-breathe {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-.3px); }
  }
  
  /* 苏醒：横线慢慢消失 */
  #pet-svg.phase-waking .idle-eye   { animation: none !important; transform: scaleY(0.05); }
  #pet-svg.phase-waking .eye-sleep  { opacity: 1; animation: eye-open .9s ease-out forwards; }
  #pet-svg.phase-waking .eye-daze   { opacity: 1; }
  @keyframes eye-open {
    0%   { opacity: 1; transform: scaleY(1); }
    100% { opacity: 0; transform: scaleY(0.05); }
  }
  
  /* 回神：半睁呆眨 */
  #pet-svg.phase-daze .idle-eye { animation: none !important; transform: scaleY(0.05); }
  #pet-svg.phase-daze .eye-daze {
    opacity: 1;
    animation: daze-blink .72s ease-in-out 3;
  }
  @keyframes daze-blink {
    0%,100% { transform: scaleY(0.45); }
    50%     { transform: scaleY(0.05); }
  }
  
  /* 生气：用 pet.html 里原有的 a-eye-angry */
  #pet-svg.phase-angry .idle-eye    { animation: none !important; transform: scaleY(0.05); }
  #pet-svg.phase-angry .a-eye-angry { opacity: 1 !important; }
  
  /* 重新入睡：半睁慢闭 + 身体起伏 */
  #pet-svg.phase-resleep .idle-eye { animation: none !important; transform: scaleY(0.05); }
  #pet-svg.phase-resleep .eye-daze {
    opacity: 1;
    animation: eye-droop-half 1.5s ease-in forwards;
  }
  #pet-svg.phase-resleep .idle-body {
    animation: sleep-breathe 3s ease-in-out infinite !important;
  }
  @keyframes eye-droop-half {
    0%   { transform: scaleY(1); }
    100% { transform: scaleY(0.05); }
  }
  
  /* a-eye-angry 默认隐藏 */
  .a-eye-angry { opacity: 0; transition: opacity 0.15s; }
  
  /* zzz */
  .zzz { pointer-events: none; opacity: 0; fill: #aaccff; }
  #pet-svg.phase-sleep   .zzz,
  #pet-svg.phase-resleep .zzz { animation: zzz-float 3s ease-in-out infinite; }
  #pet-svg.phase-sleep   .zzz:nth-of-type(2),
  #pet-svg.phase-resleep .zzz:nth-of-type(2) { animation-delay: 1s; }
  #pet-svg.phase-sleep   .zzz:nth-of-type(3),
  #pet-svg.phase-resleep .zzz:nth-of-type(3) { animation-delay: 2s; }
  @keyframes zzz-float {
    0%   { opacity: 0; transform: translate(0,0); }
    20%  { opacity: 0.8; }
    70%  { opacity: 0.8; }
    100% { opacity: 0; transform: translate(0,-6px); }
  }

  /* ════════════════════════════════════════
      吃饭动画系统（照搬 clawd-rice-meal-demo.html）
  ════════════════════════════════════════ */
  #meal-svg {
    position: absolute;
    top: 0; left: 0;
    width: 80px; height: 80px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
    image-rendering: pixelated;
  }
  .state-meal #meal-svg { opacity: 1; pointer-events: none; }
  .state-meal #pet-svg { opacity: 0; pointer-events: none; }

  #meal-svg .rm-body { transform-box: view-box; transform-origin: 7.5px 13px; animation: rm-bob 2.8s ease-in-out infinite; }
  #meal-svg .rm-shadow { transform-box: view-box; transform-origin: 7.5px 15.5px; animation: rm-shadow 2.8s ease-in-out infinite; }
  @keyframes rm-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-.35px); } }
  @keyframes rm-shadow { 0%,100% { transform: scaleX(1); opacity:.45; } 50% { transform: scaleX(.94); opacity:.35; } }
  #meal-svg .rm-eye { transform-box: fill-box; transform-origin: center; animation: rm-blink 3.7s infinite; }
  @keyframes rm-blink { 0%,45%,55%,100% { transform: scaleY(1); } 50% { transform: scaleY(.08); } }
  #meal-svg .rm-larm { transform-box: view-box; transform-origin: 2px 10px; }
  #meal-svg .rm-bowl { transform-box: view-box; transform-origin: 7.5px 13px; }
  #meal-svg .rm-spoon { transform-box: view-box; transform-origin: 13px 10px; }
  #meal-svg.eating .rm-spoon { animation: rm-feed 3.2s ease-in-out infinite; }
  @keyframes rm-feed { 0%,15% { transform: translate(0,0); } 38%,56% { transform: translate(-3.2px,-1.65px); } 78%,100% { transform: translate(0,0); } }
  #meal-svg .rm-mouth-open, #meal-svg .rm-happy-eye, #meal-svg .rm-happy-mouth { opacity:0; }
  #meal-svg.eating .rm-eye { animation: rm-eye-hide 6.4s ease-in-out infinite, rm-blink 3.7s infinite; }
  @keyframes rm-eye-hide { 0%,37% { opacity:1; } 40%,49% { opacity:0; } 52%,100% { opacity:1; } }
  #meal-svg.eating .rm-mouth { animation: rm-mouth 6.4s ease-in-out infinite; }
  #meal-svg.eating .rm-mouth-open { animation: rm-open 6.4s ease-in-out infinite; }
  #meal-svg.eating .rm-happy-eye, #meal-svg.eating .rm-happy-mouth { animation: rm-happy 6.4s ease-in-out infinite; }
  @keyframes rm-mouth { 0%,16% { opacity:1; } 20%,30% { opacity:0; } 34%,37% { opacity:1; } 40%,49% { opacity:0; } 52%,66% { opacity:1; } 70%,80% { opacity:0; } 84%,100% { opacity:1; } }
  @keyframes rm-open { 0%,18% { opacity:0; } 20%,30% { opacity:1; } 32%,68% { opacity:0; } 70%,80% { opacity:1; } 82%,100% { opacity:0; } }
  @keyframes rm-happy { 0%,37% { opacity:0; } 40%,49% { opacity:1; } 52%,100% { opacity:0; } }
  #meal-svg .rm-steam { opacity:0; }
  #meal-svg.eating .rm-steam { animation: rm-steam 2.6s ease-in-out infinite; }
  #meal-svg.eating .rm-steam.s2 { animation-delay:-1.3s; }
  @keyframes rm-steam { 0% { opacity:0; transform:translate(0,1px); } 25% { opacity:.6; } 100% { opacity:0; transform:translate(-1px,-7px); } }

  /* ════════════════════════════════════════
     洗澡动画系统（照搬 demo 结构）
  ════════════════════════════════════════ */

  /* 浴帘覆盖层容器 */
  .curtain-wrap {
    position: absolute;
    top: 0; left: 0;
    width: 80px; height: 80px;
    pointer-events: none;
    z-index: 10;
  }

  /* 左帘：初始完全隐藏 */
  .curtain-left {
    position: absolute; top: 0; left: 0;
    width: 50%; height: 100%;
    background: repeating-linear-gradient(
      90deg,
      #f0f4f8 0px, #f0f4f8 6px,
      #dde4ec 6px, #dde4ec 8px
    );
    transform: translateX(-100%);
    visibility: hidden;
  }
  /* 右帘：初始完全隐藏 */
  .curtain-right {
    position: absolute; top: 0; right: 0;
    width: 50%; height: 100%;
    background: repeating-linear-gradient(
      90deg,
      #dde4ec 0px, #dde4ec 2px,
      #f0f4f8 2px, #f0f4f8 8px
    );
    transform: translateX(100%);
    visibility: hidden;
  }
  /* 帘子动画：合拢快（0.8s），拉开慢（1.4s） */
  .curtain-left, .curtain-right {
    transition: transform 0.8s cubic-bezier(.4,0,.2,1);
  }
  .curtain-left.opening, .curtain-right.opening {
    transition: transform 1.4s cubic-bezier(.4,0,.2,1);
  }
  /* 帘子激活（可见） */
  .curtain-left.active, .curtain-right.active {
    visibility: visible;
  }
  /* 帘子合拢 */
  .curtain-left.closed  { transform: translateX(0); }
  .curtain-right.closed { transform: translateX(0); }
  /* 帘子拉开（移到屏幕外） */
  .curtain-left.opening  { transform: translateX(-100%); }
  .curtain-right.opening { transform: translateX(100%); }

  /* 浴帘上的小圆环 */
  .curtain-rings {
    position: absolute; top: 3px; left: 0; right: 0;
    display: flex; justify-content: space-around; padding: 0 2px;
  }
  .ring {
    width: 5px; height: 5px; border-radius: 50%;
    border: 1px solid #aab4c0; background: #c8d4e0;
  }

  /* 洗澡 SVG 层（绝对定位，覆盖在 pet-svg 上） */
  #shower-svg {
    position: absolute;
    top: 0; left: 0;
    width: 80px; height: 80px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .state-shower #shower-svg { opacity: 1; pointer-events: none; }
  .state-shower #pet-svg    { opacity: 0; pointer-events: none; }

  /* 交互锁定 */
  .stage.locked {
    pointer-events: none;
    cursor: not-allowed;
  }

  /* ── 洗澡 SVG 动画（照搬 demo） ── */
  #shower-svg .sh-body { transform-origin: 7.5px 13px; animation: sh-bob 2s infinite ease-in-out; }
  #shower-svg .sh-shad { transform-origin: 7.5px 15.5px; animation: sh-shadow 2s infinite ease-in-out; }
  #shower-svg .sh-eye  { transform-origin: 7.5px 9px; animation: sh-blink 3.4s infinite; }
  #shower-svg .sh-larm { transform-origin: 2px 10px; animation: sh-scrub 0.6s infinite ease-in-out alternate; }
  #shower-svg .sh-rarm { transform-origin: 13px 10px; animation: sh-rwave 2s infinite ease-in-out; }
  #shower-svg .sh-head { transform-origin: 20px -5px; animation: sh-headwag 3s infinite ease-in-out; }
  #shower-svg .sh-drop {
    opacity: 0;
    animation: sh-drop var(--dd,0.8s) var(--ds,0s) infinite linear;
  }
  #shower-svg .sh-bubble {
    opacity: 0;
    animation: sh-bubble var(--bd2,2s) var(--bs,0s) infinite ease-out;
  }
  #shower-svg .sh-foam { animation: sh-foam-pulse 1.2s infinite ease-in-out alternate; }

  @keyframes sh-bob {
    0%,100%{ transform: translateY(0); }
    50%    { transform: translateY(-.5px); }
  }
  @keyframes sh-shadow {
    0%,100%{ transform: scaleX(1); opacity: .5; }
    50%    { transform: scaleX(.96); opacity: .44; }
  }
  @keyframes sh-blink {
    0%,44%,56%,100%{ transform: scaleY(1); }
    50%            { transform: scaleY(.08); }
  }
  @keyframes sh-scrub {
    0%  { transform: rotate(-30deg); }
    100%{ transform: rotate(20deg); }
  }
  @keyframes sh-rwave {
    0%,100%{ transform: rotate(-15deg); }
    50%    { transform: rotate(5deg); }
  }
  @keyframes sh-headwag {
    0%,100%{ transform: rotate(0deg); }
    40%    { transform: rotate(-6deg); }
    70%    { transform: rotate(4deg); }
  }
  @keyframes sh-drop {
    0%  { opacity: 0; transform: translateY(0); }
    15% { opacity: .85; }
    85% { opacity: .7; }
    100%{ opacity: 0; transform: translateY(var(--dy,12px)); }
  }
  @keyframes sh-bubble {
    0%  { opacity: 0; transform: translateY(0) scale(.4); }
    20% { opacity: .7; transform: translateY(-1px) scale(1); }
    80% { opacity: .4; transform: translateY(var(--by,-7px)) scale(1.1); }
    100%{ opacity: 0; transform: translateY(var(--by2,-10px)) scale(1.3); }
  }
  @keyframes sh-foam-pulse {
    0%  { fill: #b0e8ff; }
    100%{ fill: #e0f8ff; }
  }
</style>
</head>

<div class="stage">

  <div id="talk-bubble"></div>

  <!-- 待机 SVG -->
  <svg id="pet-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-4 -21 23 41">

    <ellipse cx="7.5" cy="16" rx="5" ry=".7" fill="#000" opacity=".25"/>

    <path class="a-steam" style="--st-d:0s"

    <path class="a-steam" style="--st-d:0.32s"

    <!-- 爱心（举爱心动作） -->
    <g transform="translate(7.5, 4)">
      <path class="l-heart"
        d="M0,1.2 C0,-0.5 -2.8,-0.5 -2.8,1.5 C-2.8,3.2 0,5 0,5 C0,5 2.8,3.2 2.8,1.5 C2.8,-0.5 0,-0.5 0,1.2Z"
        fill="#ff4477"/>
      <text class="l-spark" style="--sd:.72s;--sx:-6px;--sy:-5px;" font-size="2" fill="#ff4477">♥</text>

    <rect class="sh-drop" style="--ds:-.4s;  --dd:.75s; --dy:16px" x="10.2" y="-10" width=".4" height="1.2" rx=".2" fill="#7dcfff"/>
    <rect class="sh-drop" style="--ds:-.12s; --dd:.65s; --dy:17px" x="8.2"  y="-10" width=".35" height="1" rx=".18" fill="#b0eaff"/>
    <rect class="sh-drop" style="--ds:-.35s; --dd:.8s;  --dy:15px" x="9.6"  y="-10" width=".35" height="1" rx=".18" fill="#9cdeff"/>

    <!-- 螃蟹本体 -->
    <g class="sh-body">
      <!-- 脚 -->
      <g fill="#DE886D">
        <rect x="3" y="13" width="1" height="2"/>
        <rect x="5" y="13" width="1" height="2"/>
        <rect x="9" y="13" width="1" height="2"/>
        <rect x="11" y="13" width="1" height="2"/>
      </g>
      <!-- 躯干 -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>
      <!-- 眼睛 -->
      <g class="sh-eye" fill="#000">
        <rect x="4" y="8" width="1" height="2"/>
        <rect x="10" y="8" width="1" height="2"/>
      </g>
      <!-- 右钳 -->
      <g class="sh-rarm">
        <rect x="13" y="9" width="2" height="2" rx=".3" fill="#DE886D"/>
      </g>
      <!-- 左钳 + 浴花 -->
      <g class="sh-larm">
        <rect x="0" y="9" width="2" height="2" rx=".3" fill="#DE886D"/>
        <g transform="rotate(-45, 1, 12.5)">
          <rect x="-0.2" y="11.5" width="3.2" height="2.4" rx=".6" fill="#ff8fab"/>
          <rect x="0.2"  y="11.5" width=".7"  height="2.4" fill="#ffb3c6" opacity=".7"/>
          <rect x="1.3"  y="11.5" width=".7"  height="2.4" fill="#ffb3c6" opacity=".7"/>
          <rect x="2.4"  y="11.5" width=".4"  height="2.4" fill="#ffccd5" opacity=".6"/>
        </g>
      </g>
      <!-- 头顶泡沫 -->
      <ellipse class="sh-foam" cx="7.5" cy="5.8" rx="4.4" ry="1.2" fill="#d8f4ff" opacity=".95"/>
      <circle class="sh-foam" cx="5.5" cy="4.6" r="1.4" fill="#d8f4ff" opacity=".95"/>
      <circle class="sh-foam" cx="7.5" cy="3.8" r="1.7" fill="#e8faff" opacity=".98"/>
      <circle class="sh-foam" cx="9.5" cy="4.6" r="1.4" fill="#d8f4ff" opacity=".95"/>
    </g>

    <!-- 泡泡 -->
    <circle class="sh-bubble" style="--bs:0s;   --bd2:2.2s; --by:-8px;  --by2:-12px" cx="2.5"  cy="10" r=".6" fill="none" stroke="#7dcfff" stroke-width=".35"/>
    <circle class="sh-bubble" style="--bs:-.7s;  --bd2:2s;   --by:-9px;  --by2:-13px" cx="12.8" cy="9"  r=".8" fill="none" stroke="#9cdeff" stroke-width=".3"/>
    <circle class="sh-bubble" style="--bs:-1.4s; --bd2:2.4s; --by:-7px;  --by2:-11px" cx="1.2"  cy="12" r=".5" fill="none" stroke="#b0eaff" stroke-width=".3"/>
    <circle class="sh-bubble" style="--bs:-.4s;  --bd2:1.8s; --by:-10px; --by2:-14px" cx="13.8" cy="11" r=".7" fill="none" stroke="#7dcfff" stroke-width=".35"/>
    <circle class="sh-bubble" style="--bs:-1.1s; --bd2:2.6s; --by:-6px;  --by2:-10px" cx="7.5"  cy="14" r=".45" fill="none" stroke="#c0f0ff" stroke-width=".28"/>

    <!-- 小黄鸭 -->
    <g transform="translate(-10, 14)">
      <ellipse cx="7.5" cy="2" rx="2.2" ry="1.4" fill="#ffe033"/>
      <circle cx="9" cy=".8" r="1.1" fill="#ffe033"/>
      <ellipse cx="9.9" cy=".9" rx=".6" ry=".35" fill="#ff9900"/>
      <circle cx="9.2" cy=".4" r=".22" fill="#000"/>
      <ellipse cx="7.2" cy="1.6" rx=".8" ry=".5" fill="#f5c800" transform="rotate(-15,7.2,1.6)"/>
    </g>
  </svg>

  <!-- 浴帘覆盖层 -->
  <div class="curtain-wrap" id="curtain-wrap">
    <div class="curtain-left" id="curtain-left">
      <div class="curtain-rings">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      </div>
    </div>
    <div class="curtain-right" id="curtain-right">
      <div class="curtain-rings">
        <div class="ring"></div><div class="ring"></div><div class="ring"></div>
      </div>
    </div>
  </div>

</div>

<script>
  const svg     = document.getElementById('pet-svg');
  const mealSvg = document.getElementById('meal-svg');
  const armAnim = document.getElementById('arm-anim');
  const bubble  = document.getElementById('talk-bubble');

  const lines = [
    "在呢 ~", "你在干嘛？", "点我干嘛啦",
    "嗯？", "有事吗 ◕‿◕", "别老戳我啦！",
    "🦀", "我在这里呀", "哼，知道啦",
  ];

  // do-angry 出现1次，其他各2次 → angry概率约5%，其余各~10.5%
  const clickActions = [
    'do-wink', 'do-wink',
    'do-happy', 'do-happy',
    'do-love', 'do-love',
    'do-bubble', 'do-bubble',
    'do-talk', 'do-talk',
    'do-shy', 'do-shy',
    'do-scratch', 'do-scratch',
    'do-wave', 'do-wave',
    'do-peace', 'do-peace',
    'do-water-flower', 'do-water-flower',
    'do-listen-music', 'do-listen-music',
    'do-angry',
  ];

  const actionDuration = {
    'do-wink':    900,
    'do-happy':   900,
    'do-love':    1100,
    'do-bubble':  2500,
        'do-talk':    2700,
    'do-shy':     2200,
    'do-scratch': 2200,
    'do-wave':    1600,
    'do-peace':   2000,
    'do-water-flower': 3000,
    'do-listen-music': 3500,
    'do-angry':   2100,
  };

  let actionTimer    = null;
  let talkTimer      = null;
  let isAnimating    = false;

  /* ════════════════════════════════════════
     睡眠作息系统
  ════════════════════════════════════════ */
  
  // 状态枚举
  const P = {
    IDLE:    'idle',
    YAWN:    'phase-yawn',
    SLEEP:   'phase-sleep',
    WAKING:  'phase-waking',
    DAZE:    'phase-daze',
    ANGRY:   'phase-angry',
    RESLEEP: 'phase-resleep',
  };
  const ALL_PHASES = Object.values(P).filter(p => p !== 'idle');

  // 时间常量
  const SLEEP_H  = 23;
  const WAKE_H   = 7;
  const YAWN_MS  = 1800;
  const WAKE_MS  = 900;
  const DAZE_MS  = 2100;
  const RESLEEP_MS = 1500;
  const NUISANCE_MAX     = 4;
  const NUISANCE_RST_MS  = 8000;
  const SLEEP_AGAIN_MS   = 5 * 60 * 1000;

  // 状态变量
  let phase          = P.IDLE;
  let nuisance       = 0;
  let phaseTimer     = null;
  let sleepTimer     = null;
  let cdTimer        = null;
  let nuisanceTimer  = null;
  let bubbleTimer    = null;
  let firedSleep     = false;
  let firedWake      = false;
  let lastDate       = '';
  let initDone       = false;

  // 台词
  const murmurLines  = ['唔……', '干嘛……', '嗯……', '别闹……', '困……'];
  const angryLines   = [
    '快去睡觉！', '不许打扰我睡觉！', '去睡觉啦！',
    '再戳我我真生气了！', '已经很晚了快睡！',
  ];
  const morningLines = ['早安～', '早上好！', '新的一天开始了～', '早～'];

  function inSleepWindow() {
    const h = new Date().getHours();
    return h >= SLEEP_H || h < WAKE_H;
  }

  function showBubble(text, ms = 2200) {
    clearTimeout(bubbleTimer);
    bubble.textContent = text;
    bubble.classList.add('show');
    bubbleTimer = setTimeout(() => bubble.classList.remove('show'), ms);
  }

  function setPhase(p) {
    svg.classList.remove(...ALL_PHASES);
    if (p !== P.IDLE) svg.classList.add(p);
    phase = p;
  }

  function clearAll() {
    clearTimeout(phaseTimer);
    clearTimeout(sleepTimer);
    clearInterval(cdTimer);
    clearTimeout(nuisanceTimer);
  }

  function startSleepAgainTimer() {
    clearTimeout(sleepTimer);
    clearInterval(cdTimer);
    sleepTimer = setTimeout(enterResleep, SLEEP_AGAIN_MS);
  }

  function enterYawn() {
    clearAll();
    setPhase(P.YAWN);
    showBubble('哈…欠～', 2000);
    phaseTimer = setTimeout(() => {
      setPhase(P.SLEEP);
      nuisance = 0;
    }, YAWN_MS);
  }

  function enterSleep() {
    clearAll();
    setPhase(P.SLEEP);
    nuisance = 0;
  }

  function enterWaking() {
    clearAll();
    setPhase(P.WAKING);
    phaseTimer = setTimeout(() => {
      setPhase(P.DAZE);
      phaseTimer = setTimeout(enterAngry, DAZE_MS);
    }, WAKE_MS);
  }

  function enterAngry() {
    clearTimeout(phaseTimer);
    setPhase(P.ANGRY);
    nuisance = 0;
    showBubble(angryLines[Math.floor(Math.random() * angryLines.length)], 3000);
    startSleepAgainTimer();
  }

  function enterResleep() {
    clearAll();
    setPhase(P.RESLEEP);
    phaseTimer = setTimeout(enterSleep, RESLEEP_MS);
  }

  function enterMorningWake() {
    clearAll();
    const wasSleeping = [P.SLEEP, P.RESLEEP, P.ANGRY, P.YAWN].includes(phase);
    if (wasSleeping) {
      setPhase(P.WAKING);
      phaseTimer = setTimeout(() => {
        setPhase(P.DAZE);
        phaseTimer = setTimeout(() => {
          setPhase(P.IDLE);
          showBubble(morningLines[Math.floor(Math.random() * morningLines.length)], 3000);
        }, DAZE_MS);
      }, WAKE_MS);
    } else {
      setPhase(P.IDLE);
    }
  }

  function enterIdle() {
    clearAll();
    nuisance = 0;
    bubble.classList.remove('show');
    setPhase(P.IDLE);
  }

  // 时间感知轮询
  function checkTime() {
    const now     = new Date();
    const h       = now.getHours();
    const m       = now.getMinutes();
    const s       = now.getSeconds();
    const dateStr = now.toDateString();

    if (dateStr !== lastDate) {
      lastDate   = dateStr;
      firedSleep = false;
      firedWake  = false;
    }

    // 23:00 整点 → 入睡
    if (h === SLEEP_H && m === 0 && s < 10 && !firedSleep) {
      firedSleep = true;
      if (phase === P.IDLE) enterYawn();
    }

    // 07:00 整点 → 起床
    if (h === WAKE_H && m === 0 && s < 10 && !firedWake) {
      firedWake = true;
      enterMorningWake();
    }

    // 页面加载时，若在睡眠时段且处于待机，静默进入睡着
    if (!initDone) {
      initDone = true;
      if (inSleepWindow() && phase === P.IDLE) {
        enterSleep();
      }
    }
  }

  setInterval(checkTime, 1000);
  checkTime();

  /* ══════════════════════════════════════════════════════════════ */

  function clearActions() {
    clickActions.forEach(c => svg.classList.remove(c));
    bubble.classList.remove('show');
  }

  function triggerClick() {
    if (isAnimating) return;
    const action = clickActions[Math.floor(Math.random() * clickActions.length)];

    isAnimating = true;
    clearActions();
    void svg.offsetWidth;

    svg.classList.add(action);

    if (action === 'do-talk') {
      const text = lines[Math.floor(Math.random() * lines.length)];
      bubble.textContent = text;
      bubble.classList.remove('show');
      void bubble.offsetWidth;
      bubble.classList.add('show');
      if (talkTimer) clearTimeout(talkTimer);
      talkTimer = setTimeout(() => bubble.classList.remove('show'), 2700);
    }

    if (action === 'do-bubble') {
      armAnim.setAttribute('fill', 'remove');
      armAnim.beginElement();
    }

    if (actionTimer) clearTimeout(actionTimer);
    actionTimer = setTimeout(() => {
      svg.classList.remove(action);
      isAnimating = false;
    }, actionDuration[action]);
  }



  /* ── 触摸手势 ── */

  svg.addEventListener('touchstart', (e) => {
    e.preventDefault();
  }, { passive: false });

  svg.addEventListener('touchend', (e) => {
    e.preventDefault();
    
    // 过渡动画中不响应
    if ([P.YAWN, P.WAKING, P.DAZE, P.RESLEEP].includes(phase)) return;

    if (inSleepWindow()) {
      // 睡眠时段：只走睡觉状态机
      if (phase === P.SLEEP) {
        if (Math.random() < 0.0005) {
          enterWaking();
        } else {
          showBubble(murmurLines[Math.floor(Math.random() * murmurLines.length)], 1800);
        }
        return;
      }
      if (phase === P.ANGRY) {
        showBubble(angryLines[Math.floor(Math.random() * angryLines.length)], 2500);
        startSleepAgainTimer();
        return;
      }
    } else {
      // 活跃时段：普通互动
      if (phase === P.IDLE) {
        triggerClick();
      }
    }
  }, { passive: false });

  svg.addEventListener('touchmove', () => {
  }, { passive: true });

  /* ── 鼠标事件（桌面调试用） ── */
  svg.addEventListener('mousedown', () => {
  });
  svg.addEventListener('mouseup', () => {
    // 过渡动画中不响应
    if ([P.YAWN, P.WAKING, P.DAZE, P.RESLEEP].includes(phase)) return;

    if (inSleepWindow()) {
      // 睡眠时段：只走睡觉状态机
      if (phase === P.SLEEP) {
        if (Math.random() < 0.0005) {
          enterWaking();
        } else {
          showBubble(murmurLines[Math.floor(Math.random() * murmurLines.length)], 1800);
        }
        return;
      }
      if (phase === P.ANGRY) {
        showBubble(angryLines[Math.floor(Math.random() * angryLines.length)], 2500);
        startSleepAgainTimer();
        return;
      }
    } else {
      // 活跃时段：普通互动
      if (phase === P.IDLE) {
        triggerClick();
      }
    }
  });


  /* ── 电量感知系统 ── */
  const boltEl    = document.getElementById('batt-bolt');
  const boltLowEl = document.getElementById('batt-bolt-low');

  const LOW_BATT = 20;

  function applyBatteryState(batt) {
    const pct      = Math.round(batt.level * 100);
    const charging = batt.charging;
    const isLow    = !charging && pct <= LOW_BATT;

    if (charging) {
      boltEl.classList.add('show');
      boltLowEl.classList.remove('show');
      svg.classList.remove('state-low-battery');
    } else {
      boltEl.classList.remove('show');
    }

    if (isLow) {
      boltLowEl.classList.add('show');
      svg.classList.add('state-low-battery');
    } else {
      boltLowEl.classList.remove('show');
      if (!charging) svg.classList.remove('state-low-battery');
    }

  }

  if (navigator.getBattery) {
    navigator.getBattery().then(batt => {
      applyBatteryState(batt);
      batt.addEventListener('chargingchange', () => applyBatteryState(batt));
      batt.addEventListener('levelchange',    () => applyBatteryState(batt));
    });
  }


  /* ════════════════════════════════════════
     洗澡动画系统
  ════════════════════════════════════════ */

  const stage = document.querySelector('.stage');
  const curtainLeft = document.querySelector('.curtain-left');
  const curtainRight = document.querySelector('.curtain-right');

  const CURTAIN_CLOSE_MS = 800;  // 合拢时间（快）
  const CURTAIN_OPEN_MS = 1400;  // 拉开时间（慢）
  const SHOWER_DURATION = 5 * 60 * 1000;  // 洗澡时长：5分钟

  let showerState = 'idle';  // idle | showering
  let showerTimer = null;

  // 浴帘控制
  function closeCurtain() {
    curtainLeft.classList.remove('opening');
    curtainRight.classList.remove('opening');
    curtainLeft.classList.add('active', 'closed');
    curtainRight.classList.add('active', 'closed');
  }

  function openCurtain() {
    curtainLeft.classList.add('opening');
    curtainRight.classList.add('opening');
    curtainLeft.classList.remove('closed');
    curtainRight.classList.remove('closed');
  }

  function hideCurtain() {
    curtainLeft.classList.remove('active', 'closed', 'opening');
    curtainRight.classList.remove('active', 'closed', 'opening');
  }

  // 开始洗澡流程
  function startShower() {
    if (showerState === 'showering') return;
    if (isAnimating) return;  // 如果正在播放其他动作，跳过
    
    showerState = 'showering';
    stage.classList.add('locked');  // 锁定交互
    
    // Step 1: 浴帘合拢
    closeCurtain();
    
    setTimeout(() => {
      // Step 2: 切换到洗澡 SVG（帘子盖着，用户看不到）
      stage.classList.add('state-shower');
      
      setTimeout(() => {
        // Step 3: 拉开浴帘，露出洗澡场景
        openCurtain();
        
        setTimeout(() => {
          // Step 4: 洗澡动画播放 5 分钟
          showerTimer = setTimeout(() => {
            endShower();
          }, SHOWER_DURATION);
          
        }, CURTAIN_OPEN_MS + 100);
        
      }, 100);
      
    }, CURTAIN_CLOSE_MS + 100);
  }

  // 结束洗澡
  function endShower() {
    if (showerTimer) clearTimeout(showerTimer);
    
    // Step 1: 浴帘再次合拢
    closeCurtain();
    
    setTimeout(() => {
      // Step 2: 切换回待机 SVG
      stage.classList.remove('state-shower');
      
      setTimeout(() => {
        // Step 3: 拉开浴帘
        openCurtain();
        
        setTimeout(() => {
          // Step 4: 完全隐藏浴帘，解锁交互
          hideCurtain();
          stage.classList.remove('locked');
          showerState = 'idle';
          
        }, CURTAIN_OPEN_MS + 100);
        
      }, 100);
      
    }, CURTAIN_CLOSE_MS + 100);
  }

  // 时间检查：每分钟检查一次，20:00 自动触发
  function checkShowerTime() {
    const now = new Date();
    const hour = now.getHours();
    const minute = now.getMinutes();

    // 晚上 20:00 且处于待机状态时触发洗澡
    if (hour === 20 && minute === 0 && showerState === 'idle' && phase === P.IDLE) {
      startShower();
    }
  }

  // 启动洗澡时间轮询
  setInterval(checkShowerTime, 60 * 1000);
  checkShowerTime();

  /* ════════════════════════════════════════
     吃饭动画系统
  ════════════════════════════════════════ */
  const MEAL_DURATION = 5 * 60 * 1000;  // 循环播放 5 分钟
  let mealState = 'idle';
  let mealTimer = null;
  let mealFiredDate = '';

  function startMeal() {
    if (mealState === 'eating' || showerState === 'showering' || phase !== P.IDLE) return false;
    mealState = 'eating';
    stage.classList.add('locked', 'state-meal');
    mealSvg.classList.add('eating');
    mealTimer = setTimeout(endMeal, MEAL_DURATION);
    return true;
  }

  function endMeal() {
    clearTimeout(mealTimer);
    mealTimer = null;
    mealSvg.classList.remove('eating');
    stage.classList.remove('state-meal');
    if (showerState !== 'showering') stage.classList.remove('locked');
    mealState = 'idle';
  }

  // 12:30 自动吃饭；独立命名，避免覆盖睡眠/洗澡时间检查
  function checkMealTime() {
    const now = new Date();
    const dateStr = now.toDateString();
    if (now.getHours() === 12 && now.getMinutes() === 30 && now.getSeconds() < 10 && mealFiredDate !== dateStr) {
      if (mealState === 'idle' && showerState === 'idle' && phase === P.IDLE && startMeal()) {
        mealFiredDate = dateStr;
      }
    }
  }

  setInterval(checkMealTime, 1000);
  checkMealTime();

</script>

</body>
