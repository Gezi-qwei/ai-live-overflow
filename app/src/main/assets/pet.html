<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clawd 桌宠</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    width: 80px; height: 80px;
    background: transparent;
    overflow: visible;
  }
  .stage {
    position: relative;
    width: 80px;
    height: 80px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
  }

  #pet-svg {
    width: 80px;
    height: 80px;
    image-rendering: pixelated;
    cursor: pointer;
    display: block;
    overflow: visible;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
  }

  /* ════════════════════════════════════════
     待机
  ════════════════════════════════════════ */
  .idle-eye {
    transform-box: fill-box;
    transform-origin: center center;
    animation: idle-blink 3.4s infinite;
  }
  @keyframes idle-blink {
    0%,42%,58%,100% { transform: scaleY(1); }
    50%             { transform: scaleY(0.05); }
  }

  .idle-body {
    transform-origin: 7.5px 13px;
    animation: idle-bob 2.8s infinite ease-in-out;
  }
  @keyframes idle-bob {
    0%,100% { transform: translateY(0); }
    50%     { transform: translateY(-.5px); }
  }

  /* ════════════════════════════════════════
     动作1：Wink
  ════════════════════════════════════════ */
  /* wink 期间暂停 idle-eye g 整体的 scaleY，避免左眼随之眨动 */
  #pet-svg.do-wink .idle-eye {
    animation-play-state: paused !important;
    transform: scaleY(1) !important;
  }
  #pet-svg.do-wink .w-eye-r {
    transform-box: fill-box;
    transform-origin: center center;
    animation: once-wink .7s ease-in-out forwards !important;
  }
  #pet-svg.do-wink .w-body {
    animation: once-tilt .7s ease-in-out forwards !important;
    transform-origin: 7.5px 12px;
  }
  #pet-svg.do-wink .w-star {
    animation: once-star .8s ease-out forwards !important;
  }
  @keyframes once-wink {
    0%       { transform: scaleY(1); }
    20%,65%  { transform: scaleY(0.05); }
    100%     { transform: scaleY(1); }
  }
  @keyframes once-tilt {
    0%,100%  { transform: rotate(0) translateY(0); }
    25%,70%  { transform: rotate(6deg) translateY(.3px); }
  }
  @keyframes once-star {
    0%   { opacity:0; transform:translate(0,0) scale(.3); }
    25%  { opacity:1; transform:translate(var(--tx),var(--ty)) scale(1.2); }
    70%  { opacity:.85; transform:translate(var(--tx),var(--ty)) scale(1); }
    100% { opacity:0; transform:translate(var(--tx),calc(var(--ty) - 4px)) scale(.4); }
  }

  /* ════════════════════════════════════════
     动作2：开心蹦跳
  ════════════════════════════════════════ */
  #pet-svg.do-happy .h-crab {
    animation: crab-jump .6s cubic-bezier(.25,1.6,.4,1) forwards !important;
    transform-origin: 7.5px 16px;
  }
  @keyframes crab-jump {
    0%   { transform: translateY(0) scaleX(1) scaleY(1); }
    30%  { transform: translateY(-9px) scaleX(.92) scaleY(1.06); }
    60%  { transform: translateY(-9px) scaleX(.92) scaleY(1.06); }
    80%  { transform: translateY(1px) scaleX(1.05) scaleY(.96); }
    100% { transform: translateY(0) scaleX(1) scaleY(1); }
  }

  /* ════════════════════════════════════════
     动作3：举小爱心
  ════════════════════════════════════════ */
  #pet-svg.do-love .l-arm-left {
    transform-box: fill-box;
    transform-origin: right bottom;
    animation: arm-left .45s ease-in-out forwards !important;
  }
  #pet-svg.do-love .l-arm-right {
    transform-box: fill-box;
    transform-origin: left bottom;
    animation: arm-right .45s ease-in-out forwards !important;
  }
  @keyframes arm-left {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(60deg); }
    70%  { transform: rotate(60deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes arm-right {
    0%   { transform: rotate(0deg); }
    30%  { transform: rotate(-60deg); }
    70%  { transform: rotate(-60deg); }
    100% { transform: rotate(0deg); }
  }
  .l-heart { opacity:0; transform-box:fill-box; transform-origin:center bottom; }
  #pet-svg.do-love .l-heart {
    animation: heart-grow 1s ease-out forwards !important;
  }
  @keyframes heart-grow {
    0%   { opacity:0;  transform: scale(.1) translateY(0); }
    25%  { opacity:1;  transform: scale(.7) translateY(-2px); }
    55%  { opacity:1;  transform: scale(1.2) translateY(-3px); }
    72%  { opacity:1;  transform: scale(1.5) translateY(-3px); }
    80%  { opacity:.9; transform: scale(1.6) translateY(-3px); }
    100% { opacity:0;  transform: scale(1.7) translateY(-4px); }
  }
  .l-spark { opacity:0; transform-box:fill-box; transform-origin:center center; }
  #pet-svg.do-love .l-spark {
    animation: spark-out .45s ease-out var(--sd,0s) forwards !important;
  }
  @keyframes spark-out {
    0%   { opacity:1; transform: translate(0,0) scale(1); }
    100% { opacity:0; transform: translate(var(--sx),var(--sy)) scale(.2); }
  }

  /* ════════════════════════════════════════
     动作4：吹泡泡
  ════════════════════════════════════════ */
  #pet-svg.do-bubble .b-eye {
    transform-box: fill-box;
    transform-origin: center center;
    animation: blow-eye 2.2s ease-in-out forwards !important;
  }
  @keyframes blow-eye {
    0%,18%   { transform: scaleY(1); }
    25%,68%  { transform: scaleY(0.05); }
    80%,100% { transform: scaleY(1); }
  }
  #b-mouth { r: 0px; }
  #pet-svg.do-bubble #b-mouth {
    animation: mouth-blow 2.2s ease-in-out forwards !important;
  }
  @keyframes mouth-blow {
    0%,18%   { r: 0px; }
    24%      { r: 1.1px; }
    42%      { r: 1.1px; }
    68%      { r: 0.15px; }
    75%,100% { r: 0px; }
  }
  .b-wand { opacity:0; }
  #pet-svg.do-bubble .b-wand {
    animation: wand-show 2.2s forwards !important;
  }
  @keyframes wand-show {
    0%,18%  { opacity:0; }
    22%,70% { opacity:1; }
    78%,100%{ opacity:0; }
  }
  .b-bubble { opacity:0; }
  #pet-svg.do-bubble .b-bubble {
    animation: bubble-float var(--bd,1.1s) ease-out var(--bdelay,0s) forwards !important;
  }
  @keyframes bubble-float {
    0%   { opacity:0;   transform: translate(0,0) scale(.2); }
    15%  { opacity:.8;  transform: translate(var(--bx1),var(--by1)) scale(1); }
    55%  { opacity:.65; transform: translate(var(--bx2),var(--by2)) scale(1.05); }
    100% { opacity:0;   transform: translate(var(--bx3),var(--by3)) scale(.7); }
  }

  /* ════════════════════════════════════════
     动作5：摸摸头
  ════════════════════════════════════════ */
  #pet-svg.do-pat .p-eye {
    transform-box: fill-box;
    transform-origin: center center;
    animation: pat-eye 1.6s ease-in-out forwards !important;
  }
  @keyframes pat-eye {
    0%,15%   { transform: scaleY(1); }
    30%,75%  { transform: scaleY(0.1); }
    90%,100% { transform: scaleY(1); }
  }
  #pet-svg.do-pat .p-crab {
    animation: pat-squish 1.6s ease-in-out forwards !important;
    transform-origin: 7.5px 11px;
  }
  @keyframes pat-squish {
    0%,15%   { transform: translateY(0) scaleY(1) scaleX(1); }
    35%,70%  { transform: translateY(1.2px) scaleY(.93) scaleX(1.04); }
    85%,100% { transform: translateY(0) scaleY(1) scaleX(1); }
  }
  .p-hand { opacity:0; }
  #pet-svg.do-pat .p-hand {
    animation: hand-pat 1.6s ease-in-out forwards !important;
  }
  @keyframes hand-pat {
    0%   { opacity:0; transform: translateY(-8px); }
    18%  { opacity:1; transform: translateY(-8px); }
    35%  { opacity:1; transform: translateY(0px); }
    68%  { opacity:1; transform: translateY(0px); }
    75%  { opacity:1; transform: translateY(1px); }
    80%  { opacity:1; transform: translateY(0px); }
    92%  { opacity:0; transform: translateY(-6px); }
    100% { opacity:0; transform: translateY(-8px); }
  }
  .p-sparkle { opacity:0; }
  #pet-svg.do-pat .p-sparkle {
    animation: sparkle-pop 1.6s ease-out var(--sd,0s) forwards !important;
  }
  @keyframes sparkle-pop {
    0%      { opacity:0; transform: translate(0,0) scale(.2); }
    20%,50% { opacity:.8; transform: translate(var(--sx),var(--sy)) scale(1); }
    100%    { opacity:0; transform: translate(var(--sx), calc(var(--sy) - 2px)) scale(.5); }
  }

  /* ════════════════════════════════════════
     动作6：说话气泡
  ════════════════════════════════════════ */
  #pet-svg.do-talk .t-body {
    transform-origin: 7.5px 12px;
    animation: talk-sway 2.3s ease-in-out forwards !important;
  }
  @keyframes talk-sway {
    0%,100% { transform: rotate(0deg); }
    15%     { transform: rotate(-2deg); }
    30%     { transform: rotate(2deg); }
    45%     { transform: rotate(-1.5deg); }
    60%     { transform: rotate(1.5deg); }
    75%     { transform: rotate(-.5deg); }
    88%     { transform: rotate(0deg); }
  }
  #talk-bubble {
    position: absolute;
    bottom: calc(100% - 20px);
    left: 50%;
    transform: translateX(-50%) scale(0);
    transform-origin: center bottom;
    background: #fff;
    color: #222;
    font-size: 12px;
    font-family: 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
    padding: 6px 10px;
    border-radius: 10px;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,.3);
    pointer-events: none;
    opacity: 0;
    z-index: 10;
  }
  #talk-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%);
    border: 6px solid transparent;
    border-top: 6px solid #fff;
    border-bottom: 0;
  }
  #talk-bubble.show {
    animation: bubble-in .25s cubic-bezier(.2,1.4,.4,1) forwards,
               bubble-out .3s ease-in 2s forwards;
  }
  @keyframes bubble-in {
    0%   { opacity:0; transform:translateX(-50%) scale(.3); }
    100% { opacity:1; transform:translateX(-50%) scale(1); }
  }
  @keyframes bubble-out {
    0%   { opacity:1; transform:translateX(-50%) scale(1); }
    100% { opacity:0; transform:translateX(-50%) translateY(-8px) scale(.85); }
  }

  /* ════════════════════════════════════════
     动作7：害羞
  ════════════════════════════════════════ */
  #pet-svg.do-shy .s-body {
    transform-box: fill-box;
    transform-origin: 7.5px 11px;
    animation: shy-squish 2.0s ease-in-out forwards !important;
  }
  @keyframes shy-squish {
    0%   { transform: translateY(0) scale(1); }
    18%  { transform: translateY(1.5px) scale(0.92); }
    72%  { transform: translateY(1.5px) scale(0.92); }
    100% { transform: translateY(0) scale(1); }
  }
  #pet-svg.do-shy .s-eye-rect {
    animation: s-eye-hide 2.0s forwards !important;
  }
  @keyframes s-eye-hide {
    0%   { opacity:1; }
    10%  { opacity:0; }
    85%  { opacity:0; }
    100% { opacity:1; }
  }
  .s-eye-curve { opacity:0; }
  #pet-svg.do-shy .s-eye-curve {
    animation: s-eye-show 2.0s forwards !important;
  }
  @keyframes s-eye-show {
    0%   { opacity:0; }
    10%  { opacity:1; }
    85%  { opacity:1; }
    100% { opacity:0; }
  }
  .s-blush { opacity:0; }
  #pet-svg.do-shy .s-blush {
    animation: blush-pop 2.0s ease-out forwards !important;
  }
  @keyframes blush-pop {
    0%   { opacity:0; }
    15%  { opacity:0.9; }
    72%  { opacity:0.9; }
    100% { opacity:0; }
  }
  #pet-svg.do-shy .s-arm-l {
    transform-box: fill-box;
    transform-origin: right bottom;
    animation: arm-l-shy 2.0s ease-in-out forwards !important;
  }
  #pet-svg.do-shy .s-arm-r {
    transform-box: fill-box;
    transform-origin: left bottom;
    animation: arm-r-shy 2.0s ease-in-out forwards !important;
  }
  @keyframes arm-l-shy {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(70deg); }
    72%  { transform: rotate(70deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes arm-r-shy {
    0%   { transform: rotate(0deg); }
    18%  { transform: rotate(-70deg); }
    72%  { transform: rotate(-70deg); }
    100% { transform: rotate(0deg); }
  }

  /* ════════════════════════════════════════
     动作8：挠头
   ════════════════════════════════════════ */
  #pet-svg.do-scratch .sc-body {
    transform-origin: 7.5px 13px;
    animation: scratch-tilt 2.0s ease-in-out forwards !important;
  }
  @keyframes scratch-tilt {
    0%   { transform: rotate(0deg); }
    12%  { transform: rotate(-5deg); }
    85%  { transform: rotate(-5deg); }
    100% { transform: rotate(0deg); }
  }
  .sc-arm-r {
    transform-box: fill-box;
    transform-origin: left top;
  }
  #pet-svg.do-scratch .sc-arm-r {
    animation: scratch-arm 2.0s ease-in-out forwards !important;
  }
  @keyframes scratch-arm {
    0%   { transform: rotate(0deg) translate(0,0); }
    10%  { transform: rotate(-90deg) translate(-1px,-1px); }
    18%  { transform: rotate(-95deg) translate(-1.5px,-1px); }
    26%  { transform: rotate(-82deg) translate(-0.5px,-1.5px); }
    34%  { transform: rotate(-96deg) translate(-1.5px,-1px); }
    42%  { transform: rotate(-80deg) translate(-0.5px,-1.5px); }
    50%  { transform: rotate(-95deg) translate(-1.5px,-1px); }
    58%  { transform: rotate(-83deg) translate(-0.5px,-1.5px); }
    66%  { transform: rotate(-94deg) translate(-1.5px,-1px); }
    74%  { transform: rotate(-84deg) translate(-0.5px,-1.5px); }
    82%  { transform: rotate(-90deg) translate(-1px,-1px); }
    100% { transform: rotate(0deg) translate(0,0); }
  }
  #pet-svg.do-scratch .sc-eye-rect {
    animation: sc-eye-hide 2.0s forwards !important;
  }
  @keyframes sc-eye-hide {
    0%  { opacity:1; }
    10% { opacity:0; }
    85% { opacity:0; }
    100%{ opacity:1; }
  }
  .sc-eye-dot { opacity:0; }
  #pet-svg.do-scratch .sc-eye-dot {
    animation: sc-dot-show 2.0s forwards !important;
  }
  @keyframes sc-dot-show {
    0%  { opacity:0; }
    10% { opacity:1; }
    85% { opacity:1; }
    100%{ opacity:0; }
  }
  .sc-question {
    opacity: 0;
    transform-origin: center bottom;
    font-family: 'Segoe UI', system-ui, sans-serif;
    font-size: 4px;
    font-weight: bold;
    fill: #555;
  }
  #pet-svg.do-scratch .sc-question {
    animation: question-pop 2.0s ease-out forwards !important;
  }
  @keyframes question-pop {
    0%   { opacity:0; transform: translate(0,0) scale(0.2); }
    14%  { opacity:1; transform: translate(0,-2px) scale(1.2); }
    20%  { opacity:1; transform: translate(0,-3px) scale(1); }
    72%  { opacity:1; transform: translate(0,-3px) scale(1); }
    85%  { opacity:0.6; transform: translate(0,-6px) scale(0.9); }
    100% { opacity:0; transform: translate(0,-9px) scale(0.7); }
  }
  .sc-q-bg { opacity:0; transform-origin: center center; }
  #pet-svg.do-scratch .sc-q-bg {
    animation: q-bg-pop 2.0s ease-out forwards !important;
  }
  @keyframes q-bg-pop {
    0%   { opacity:0; transform: translate(0,0) scale(0.2); }
    14%  { opacity:0.85; transform: translate(0,-2px) scale(1.2); }
    20%  { opacity:0.85; transform: translate(0,-3px) scale(1); }
    72%  { opacity:0.85; transform: translate(0,-3px) scale(1); }
    85%  { opacity:0.4; transform: translate(0,-6px) scale(0.9); }
    100% { opacity:0; transform: translate(0,-9px) scale(0.7); }
  }

  /* ════════════════════════════════════════
     双击动作A：打招呼
   ════════════════════════════════════════ */
  #pet-svg.do-wave .wv-body {
    transform-origin: 7.5px 15px;
    animation: wave-jump 1.4s cubic-bezier(.25,1.4,.4,1) forwards !important;
  }
  @keyframes wave-jump {
    0%      { transform: translateY(0) scaleX(1) scaleY(1); }
    16%,68% { transform: translateY(-4px) scaleX(.97) scaleY(1.03); }
    78%     { transform: translateY(0.5px) scaleX(1.02) scaleY(.98); }
    100%    { transform: translateY(0) scaleX(1) scaleY(1); }
  }
  .wv-arm-r {
    transform-box: fill-box;
    transform-origin: left top;
  }
  #pet-svg.do-wave .wv-arm-r {
    animation: wave-arm 1.4s ease-in-out forwards !important;
  }
  @keyframes wave-arm {
    0%   { transform: rotate(0deg); }
    12%  { transform: rotate(-70deg); }
    22%  { transform: rotate(-55deg); }
    32%  { transform: rotate(-75deg); }
    42%  { transform: rotate(-50deg); }
    52%  { transform: rotate(-72deg); }
    62%  { transform: rotate(-55deg); }
    72%  { transform: rotate(-70deg); }
    86%  { transform: rotate(-20deg); }
    100% { transform: rotate(0deg); }
  }

  /* ════════════════════════════════════════
     双击动作B：比耶
   ════════════════════════════════════════ */
  #pet-svg.do-peace .pc-body {
    transform-origin: 7.5px 13px;
    animation: peace-pose 1.8s ease-in-out forwards !important;
  }
  @keyframes peace-pose {
    0%   { transform: rotate(0deg) translateY(0); }
    15%  { transform: rotate(-3deg) translateY(-1px); }
    70%  { transform: rotate(-3deg) translateY(-1px); }
    100% { transform: rotate(0deg) translateY(0); }
  }
  .pc-arm-l {
    transform-box: fill-box;
    transform-origin: right bottom;
  }
  #pet-svg.do-peace .pc-arm-l {
    animation: peace-arm-l 1.8s ease-in-out forwards !important;
  }
  @keyframes peace-arm-l {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(55deg); }
    70%  { transform: rotate(55deg); }
    100% { transform: rotate(0deg); }
  }
  #pet-svg.do-peace .pc-arm-r-base {
    animation: peace-arm-r-hide 1.8s forwards !important;
  }
  @keyframes peace-arm-r-hide {
    0%,12% { opacity:1; }
    20%    { opacity:0; }
    72%    { opacity:0; }
    100%   { opacity:1; }
  }
  .pc-v { opacity:0; }
  #pet-svg.do-peace .pc-v {
    animation: peace-v-fade 1.8s ease-in-out forwards !important;
  }
  @keyframes peace-v-fade {
    0%,12% { opacity:0; }
    20%    { opacity:1; }
    70%    { opacity:1; }
    85%    { opacity:0; }
    100%   { opacity:0; }
  }
  #pet-svg.do-peace .pc-eye-rect {
    animation: pc-eye-hide 1.8s forwards !important;
  }
  @keyframes pc-eye-hide {
    0%,12% { opacity:1; }
    20%    { opacity:0; }
    72%    { opacity:0; }
    100%   { opacity:1; }
  }
  .pc-eye-smile { opacity:0; }
  #pet-svg.do-peace .pc-eye-smile {
    animation: pc-eye-smile-show 1.8s forwards !important;
  }
  @keyframes pc-eye-smile-show {
    0%,12% { opacity:0; }
    20%    { opacity:1; }
    72%    { opacity:1; }
    100%   { opacity:0; }
  }
  .pc-spark { opacity:0; }
  #pet-svg.do-peace .pc-spark {
    animation: pc-spark-pop 1.4s ease-out var(--ps-d,0s) forwards !important;
  }
  @keyframes pc-spark-pop {
    0%   { opacity:0; transform: translate(0,0) scale(.2); }
    20%  { opacity:1; transform: translate(var(--psx),var(--psy)) scale(1.2); }
    55%  { opacity:.8; transform: translate(var(--psx),var(--psy)) scale(1); }
    100% { opacity:0; transform: translate(var(--psx),calc(var(--psy) - 2px)) scale(.5); }
  }

  /* ════════════════════════════════════════
     长按动作：生气
   ════════════════════════════════════════ */
  #pet-svg.do-angry .a-body {
    animation: angry-red 1.8s ease-in-out forwards,
               angry-shake 0.5s ease-in-out 0.12s 3 forwards !important;
  }
  @keyframes angry-red {
    0%   { filter: none; }
    15%  { filter: hue-rotate(-20deg) saturate(1.8) brightness(1.1); }
    80%  { filter: hue-rotate(-20deg) saturate(1.8) brightness(1.1); }
    100% { filter: none; }
  }
  @keyframes angry-shake {
    0%   { transform: translateX(0); }
    20%  { transform: translateX(-2px); }
    40%  { transform: translateX(2px); }
    60%  { transform: translateX(-2px); }
    80%  { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }
  #pet-svg.do-angry .a-eye-rect {
    animation: a-eye-hide 1.8s forwards !important;
  }
  @keyframes a-eye-hide {
    0%   { opacity:1; }
    12%  { opacity:0; }
    82%  { opacity:0; }
    100% { opacity:1; }
  }
  .a-eye-angry { opacity:0; }
  #pet-svg.do-angry .a-eye-angry {
    animation: a-eye-show 1.8s forwards !important;
  }
  @keyframes a-eye-show {
    0%   { opacity:0; }
    12%  { opacity:1; }
    82%  { opacity:1; }
    100% { opacity:0; }
  }
  .a-steam { opacity:0; }
  #pet-svg.do-angry .a-steam {
    animation: steam-rise .7s ease-out var(--st-d,0s) infinite !important;
  }
  #pet-svg:not(.do-angry) .a-steam { animation:none !important; opacity:0; }
  @keyframes steam-rise {
    0%   { opacity:0;   transform: translateY(0) scaleX(1); }
    20%  { opacity:0.8; transform: translateY(-1px) scaleX(1.1); }
    60%  { opacity:0.6; transform: translateY(-3px) scaleX(1.3); }
    100% { opacity:0;   transform: translateY(-6px) scaleX(0.8); }
  }
  #pet-svg.do-angry .a-arm-l {
    transform-box: fill-box;
    transform-origin: right top;
    animation: arm-angry-l 1.8s ease-in-out forwards !important;
  }
  #pet-svg.do-angry .a-arm-r {
    transform-box: fill-box;
    transform-origin: left top;
    animation: arm-angry-r 1.8s ease-in-out forwards !important;
  }
  @keyframes arm-angry-l {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(-25deg); }
    80%  { transform: rotate(-25deg); }
    100% { transform: rotate(0deg); }
  }
  @keyframes arm-angry-r {
    0%   { transform: rotate(0deg); }
    15%  { transform: rotate(25deg); }
    80%  { transform: rotate(25deg); }
    100% { transform: rotate(0deg); }
  }
</style>
</head>
<body>

<div class="stage">

  <div id="talk-bubble"></div>

  <svg id="pet-svg" xmlns="http://www.w3.org/2000/svg" viewBox="-4 -21 23 41">

    <!-- 阴影 -->
    <ellipse cx="7.5" cy="16" rx="5" ry=".7" fill="#000" opacity=".25"/>

    <!-- 蒸汽（生气，渲染在螃蟹下层避免被遮） -->
    <path class="a-steam" style="--st-d:0s"
      d="M 3,3 Q 2,1.5 3,0 Q 4,-1.5 3,-3"
      fill="none" stroke="#ff9966" stroke-width="0.7" stroke-linecap="round"/>
    <path class="a-steam" style="--st-d:0.18s"
      d="M 12,3 Q 11,1.5 12,0 Q 13,-1.5 12,-3"
      fill="none" stroke="#ff9966" stroke-width="0.7" stroke-linecap="round"/>
    <path class="a-steam" style="--st-d:0.32s"
      d="M 7.5,2 Q 6.8,0.5 7.5,-1 Q 8.2,-2.5 7.5,-4"
      fill="none" stroke="#ffbb88" stroke-width="0.5" stroke-linecap="round"/>

    <!-- 爱心（举爱心动作） -->
    <g transform="translate(7.5, 4)">
      <path class="l-heart"
        d="M0,1.2 C0,-0.5 -2.8,-0.5 -2.8,1.5 C-2.8,3.2 0,5 0,5 C0,5 2.8,3.2 2.8,1.5 C2.8,-0.5 0,-0.5 0,1.2Z"
        fill="#ff4477"/>
      <text class="l-spark" style="--sd:.72s;--sx:-6px;--sy:-5px;" font-size="2" fill="#ff4477">♥</text>
      <text class="l-spark" style="--sd:.72s;--sx:6px;--sy:-5px;"  font-size="2" fill="#ff6699">♥</text>
      <text class="l-spark" style="--sd:.74s;--sx:-7px;--sy:1px;"  font-size="1.5" fill="#ff4477">♥</text>
      <text class="l-spark" style="--sd:.74s;--sx:7px;--sy:1px;"   font-size="1.5" fill="#ff6699">♥</text>
      <text class="l-spark" style="--sd:.73s;--sx:0px;--sy:-8px;"  font-size="1.8" fill="#ff88aa">♥</text>
      <text class="l-spark" style="--sd:.75s;--sx:-4px;--sy:-7px;" font-size="1.2" fill="#ff4477">✦</text>
      <text class="l-spark" style="--sd:.75s;--sx:4px;--sy:-7px;"  font-size="1.2" fill="#ff4477">✦</text>
    </g>

    <!-- Wink 星星 -->
    <text class="w-star" style="--tx:5px;--ty:-6px"
          x="12" y="6" font-size="3" fill="#ffe066" opacity="0">✦</text>
    <text class="w-star" style="--tx:3px;--ty:-4px;animation-delay:.08s"
          x="14.5" y="3.5" font-size="2.2" fill="#ffcc00" opacity="0">✦</text>
    <text class="w-star" style="--tx:2px;--ty:-3px;animation-delay:.16s"
          x="11.5" y="1" font-size="1.6" fill="#fff0a0" opacity="0">✦</text>

    <!-- 摸摸头的手已移除 -->
    <!-- 摸摸头星星 -->
    <text class="p-sparkle" style="--sd:.3s;--sx:-3px;--sy:-5px"
          x="5" y="-5" font-size="1.8" fill="#ffe066">✦</text>
    <text class="p-sparkle" style="--sd:.42s;--sx:3px;--sy:-4px"
          x="9" y="-6" font-size="1.4" fill="#ffcc44">✦</text>
    <text class="p-sparkle" style="--sd:.36s;--sx:0px;--sy:-6px"
          x="7" y="-7" font-size="1.2" fill="#fff0a0">✦</text>

    <!-- 比耶闪光（在螃蟹外层上方渲染） -->
    <text class="pc-spark" style="--ps-d:0.25s;--psx:9px;--psy:-11px"
          x="16" y="4" font-size="2.5" fill="#ffe066" text-anchor="middle">✦</text>
    <text class="pc-spark" style="--ps-d:0.35s;--psx:6px;--psy:-13px"
          x="16" y="4" font-size="1.8" fill="#ffcc44" text-anchor="middle">✦</text>
    <text class="pc-spark" style="--ps-d:0.3s;--psx:11px;--psy:-8px"
          x="16" y="4" font-size="1.5" fill="#fff0a0" text-anchor="middle">✦</text>

    <!-- 比耶 V 形手（右钳正上方，rotate(45°)向右下，≈2×2 大小） -->
    <g class="pc-v" transform="rotate(45, 14.5, 9.5)">
      <rect x="13.5" y="8.2" width="0.7" height="1.5" rx="0.2" fill="#DE886D"/>
      <rect x="14.8" y="8.4" width="0.7" height="1.3" rx="0.2" fill="#DE886D"/>
      <rect x="13.5" y="9.5" width="2.0" height="0.6" fill="#DE886D"/>
    </g>

    <!-- ════════════════════════════════════
         螃蟹本体
         多个动作 class 挂同一个 g，
         哪个动作激活对应 class 的 animation 就生效
    ════════════════════════════════════ -->
    <g class="idle-body h-crab p-crab s-body a-body wv-body sc-body pc-body">

      <!-- 腿 -->
      <g fill="#DE886D">
        <rect x="3"  y="13" width="1" height="2"/>
        <rect x="5"  y="13" width="1" height="2"/>
        <rect x="9"  y="13" width="1" height="2"/>
        <rect x="11" y="13" width="1" height="2"/>
      </g>

      <!-- 身体 -->
      <rect x="2" y="6" width="11" height="7" fill="#DE886D"/>

      <!-- 左钳子（举爱心 / 害羞 / 生气 / 比耶） -->
      <g class="l-arm-left s-arm-l a-arm-l pc-arm-l">
        <rect x="0" y="9" width="2" height="2" fill="#DE886D"/>
      </g>

      <!-- 右钳子（举爱心 / 害羞 / 生气 + 吹泡泡 animateTransform / 打招呼 / 挠头） -->
      <g id="b-arm-group">
        <rect class="l-arm-right s-arm-r a-arm-r wv-arm-r sc-arm-r pc-arm-r-base"
              x="13" y="9" width="2" height="2" fill="#DE886D"/>
        <!-- 泡泡棒 -->
        <g class="b-wand">
          <rect x="13.7" y="3.5" width=".6" height="5.5" fill="#bbb"/>
          <circle cx="14" cy="3" r="1.3" fill="none" stroke="#bbb" stroke-width=".5"/>
          <circle cx="14" cy="3" r="1"   fill="#aaddff" opacity=".3"/>
        </g>
        <animateTransform
          id="arm-anim"
          attributeName="transform"
          type="rotate"
          values="0 13 10; 0 13 10; -70 13 10; -70 13 10; 0 13 10"
          keyTimes="0; 0.05; 0.22; 0.70; 1"
          dur="2.2s"
          begin="indefinite"
          fill="freeze"
          calcMode="spline"
          keySplines="0 0 1 1; .4 0 .2 1; 0 0 1 1; .4 0 .2 1"
        />
      </g>

      <!-- 普通眼睛（待机眨眼同步；g 整体做 scaleY，避免左右轮流） -->
      <g class="idle-eye">
        <rect class="b-eye p-eye s-eye-rect a-eye-rect sc-eye-rect pc-eye-rect"
              x="4"  y="8" width="1" height="2" fill="#000"/>
        <rect class="w-eye-r b-eye p-eye s-eye-rect a-eye-rect sc-eye-rect pc-eye-rect"
              x="10" y="8" width="1" height="2" fill="#000"/>
      </g>

      <!-- 挠头迷茫小点眼（· ·） -->
      <circle class="sc-eye-dot" cx="4.5"  cy="9" r="0.55" fill="#000"/>
      <circle class="sc-eye-dot" cx="10.5" cy="9" r="0.55" fill="#000"/>

      <!-- 比耶弯弯笑眼 -->
      <path class="pc-eye-smile"
        d="M 3.8,8.5 Q 4.5,7.6 5.2,8.5"
        fill="none" stroke="#000" stroke-width="0.55" stroke-linecap="round"/>
      <path class="pc-eye-smile"
        d="M 9.8,8.5 Q 10.5,7.6 11.2,8.5"
        fill="none" stroke="#000" stroke-width="0.55" stroke-linecap="round"/>

      <!-- Wink / talk 时整体可加 w-body / t-body -->
      <!-- 用一个透明 rect 套住 body 区域，承载 w-body 和 t-body 的旋转 -->
      <!-- 注意：w-body 和 t-body 直接加在外层 g 上会和其他动画冲突，
           所以单独包一层 -->

      <!-- 弯弯眼（害羞） -->
      <path class="s-eye-curve"
        d="M 4,9.2 Q 4.5,8.2 5,9.2"
        fill="none" stroke="#000" stroke-width="0.5" stroke-linecap="round"/>
      <path class="s-eye-curve"
        d="M 10,9.2 Q 10.5,8.2 11,9.2"
        fill="none" stroke="#000" stroke-width="0.5" stroke-linecap="round"/>

      <!-- 腮红（害羞） -->
      <ellipse class="s-blush" cx="3.0"  cy="10.8" rx="1.6" ry="0.9" fill="#ff6ba8" opacity=".9"/>
      <ellipse class="s-blush" cx="12.0" cy="10.8" rx="1.6" ry="0.9" fill="#ff6ba8" opacity=".9"/>

      <!-- 生气眼（八字眉 + 瞪眼 + 倒弧嘴） -->
      <rect class="a-eye-angry" x="4"  y="8" width="1" height="2" fill="#1a0000"/>
      <rect class="a-eye-angry" x="10" y="8" width="1" height="2" fill="#1a0000"/>
      <line class="a-eye-angry"
        x1="3.5" y1="7.0" x2="5.2" y2="7.8"
        stroke="#1a0000" stroke-width="0.5" stroke-linecap="round"/>
      <line class="a-eye-angry"
        x1="9.8" y1="7.8" x2="11.5" y2="7.0"
        stroke="#1a0000" stroke-width="0.5" stroke-linecap="round"/>
      <path class="a-eye-angry"
        d="M 5.5,12.2 Q 7.5,11.2 9.5,12.2"
        fill="none" stroke="#1a0000" stroke-width="0.45" stroke-linecap="round"/>

      <!-- 吹泡泡嘴 -->
      <circle id="b-mouth" cx="7.5" cy="11.5" r="0" fill="#000"/>

    </g><!-- end crab body group -->

    <!-- 泡泡 -->
    <circle class="b-bubble"
      style="--bdelay:.52s;--bd:1.2s;--bx1:-2px;--by1:-8px;--bx2:-5px;--by2:-18px;--bx3:-6px;--by3:-28px"
      cx="14" cy="3" r="2.3" fill="none" stroke="#88ddff" stroke-width=".5"/>
    <circle class="b-bubble"
      style="--bdelay:.72s;--bd:1.3s;--bx1:1px;--by1:-7px;--bx2:2px;--by2:-18px;--bx3:2px;--by3:-29px"
      cx="14" cy="3" r="1.6" fill="none" stroke="#aaeeff" stroke-width=".45"/>
    <circle class="b-bubble"
      style="--bdelay:.92s;--bd:1.15s;--bx1:-3px;--by1:-6px;--bx2:-6px;--by2:-15px;--bx3:-7px;--by3:-24px"
      cx="14" cy="3" r="1.2" fill="none" stroke="#bbeeff" stroke-width=".4"/>
    <circle class="b-bubble"
      style="--bdelay:1.1s;--bd:1.05s;--bx1:0px;--by1:-5px;--bx2:3px;--by2:-13px;--bx3:3px;--by3:-22px"
      cx="14" cy="3" r=".85" fill="none" stroke="#cceeff" stroke-width=".35"/>

    <!-- 挠头问号气泡（螃蟹外层，避免被 body clip） -->
    <circle class="sc-q-bg" cx="14" cy="2" r="2.8" fill="#fff" opacity="0.85"/>
    <text class="sc-question" x="14" y="4" text-anchor="middle" fill="#555">?</text>

  </svg>

</div>

<script>
  const svg     = document.getElementById('pet-svg');
  const armAnim = document.getElementById('arm-anim');
  const bubble  = document.getElementById('talk-bubble');

  const lines = [
    "在呢 ~", "你在干嘛？", "点我干嘛啦",
    "嗯？", "有事吗 ◕‿◕", "别老戳我啦！",
    "🦀", "我在这里呀", "哼，知道啦",
  ];

  const clickActions = [
    'do-wink', 'do-happy', 'do-love',
    'do-bubble', 'do-pat', 'do-talk', 'do-shy', 'do-scratch',
  ];

  const doubleClickActions = [
    'do-wave', 'do-peace',
  ];

  const actionDuration = {
    'do-wink':    900,
    'do-happy':   900,
    'do-love':    1100,
    'do-bubble':  2500,
    'do-pat':     1800,
    'do-talk':    2700,
    'do-shy':     2200,
    'do-scratch': 2200,
    'do-wave':    1600,
    'do-peace':   2000,
    'do-angry':   2100,
  };

  let actionTimer    = null;
  let talkTimer      = null;
  let longPressTimer = null;
  let isLongPress    = false;
  let isAnimating    = false;

  // 双击判定
  const DOUBLE_TAP_MS = 300;
  let lastTapTime     = 0;

  function clearActions() {
    clickActions.forEach(c => svg.classList.remove(c));
    doubleClickActions.forEach(c => svg.classList.remove(c));
    svg.classList.remove('do-angry');
    bubble.classList.remove('show');
  }

  function triggerClick() {
    if (isAnimating) return;
    const action = clickActions[Math.floor(Math.random() * clickActions.length)];

    isAnimating = true;
    clearActions();
    void svg.offsetWidth;
    svg.classList.add(action);

    if (action === 'do-talk') {
      const text = lines[Math.floor(Math.random() * lines.length)];
      bubble.textContent = text;
      bubble.classList.remove('show');
      void bubble.offsetWidth;
      bubble.classList.add('show');
      if (talkTimer) clearTimeout(talkTimer);
      talkTimer = setTimeout(() => bubble.classList.remove('show'), 2700);
    }

    if (action === 'do-bubble') {
      armAnim.setAttribute('fill', 'remove');
      armAnim.beginElement();
    }

    if (actionTimer) clearTimeout(actionTimer);
    actionTimer = setTimeout(() => {
      svg.classList.remove(action);
      isAnimating = false;
    }, actionDuration[action]);
  }

  function triggerDoubleClick() {
    if (isAnimating) return;
    const action = doubleClickActions[Math.floor(Math.random() * doubleClickActions.length)];

    isAnimating = true;
    clearActions();
    void svg.offsetWidth;
    svg.classList.add(action);

    if (actionTimer) clearTimeout(actionTimer);
    actionTimer = setTimeout(() => {
      svg.classList.remove(action);
      isAnimating = false;
    }, actionDuration[action]);
  }

  function triggerAngry() {
    if (isAnimating) return;
    isAnimating = true;
    clearActions();
    void svg.offsetWidth;
    svg.classList.add('do-angry');

    if (actionTimer) clearTimeout(actionTimer);
    actionTimer = setTimeout(() => {
      svg.classList.remove('do-angry');
      isAnimating = false;
    }, actionDuration['do-angry']);
  }

  /* ── 触摸手势（500ms 长按 / 300ms 双击判定） ── */
  const LONG_PRESS_MS = 500;

  svg.addEventListener('touchstart', (e) => {
    e.preventDefault();
    isLongPress = false;
    longPressTimer = setTimeout(() => {
      isLongPress = true;
      triggerAngry();
    }, LONG_PRESS_MS);
  }, { passive: false });

  svg.addEventListener('touchend', (e) => {
    e.preventDefault();
    clearTimeout(longPressTimer);
    if (!isLongPress) {
      const now = Date.now();
      if (now - lastTapTime < DOUBLE_TAP_MS) {
        lastTapTime = 0;
        triggerDoubleClick();
      } else {
        lastTapTime = now;
        triggerClick();
      }
    }
    isLongPress = false;
  }, { passive: false });

  svg.addEventListener('touchmove', () => {
    clearTimeout(longPressTimer);
  }, { passive: true });

  /* ── 鼠标事件（桌面调试用） ── */
  svg.addEventListener('mousedown', () => {
    isLongPress = false;
    longPressTimer = setTimeout(() => {
      isLongPress = true;
      triggerAngry();
    }, LONG_PRESS_MS);
  });
  svg.addEventListener('mouseup', () => {
    clearTimeout(longPressTimer);
    if (!isLongPress) {
      const now = Date.now();
      if (now - lastTapTime < DOUBLE_TAP_MS) {
        lastTapTime = 0;
        triggerDoubleClick();
      } else {
        lastTapTime = now;
        triggerClick();
      }
    }
    isLongPress = false;
  });
  svg.addEventListener('mouseleave', () => {
    clearTimeout(longPressTimer);
    isLongPress = false;
  });
</script>

</body>
</html>
